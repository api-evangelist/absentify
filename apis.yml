name: Absentify
description: >-
  Absentify is an absence management platform integrated with Microsoft 365 and Microsoft Teams that helps businesses
  track and manage employee absences, leave requests, approvals, and team schedules. Built by BrainCore Solutions GmbH,
  it provides a REST API for integrating absence management into custom workflows, HR systems, and business automation
  tools.
