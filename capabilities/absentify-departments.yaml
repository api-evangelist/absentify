      operations:
      - name: departmentgetdepartmentbyid
        method: GET
        description: Absentify Read a Department by Id
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
      - name: departmentupdatedepartment
