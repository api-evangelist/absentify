    resources:
    - name: departments
      path: /departments
      operations:
      - name: departmentgetdepartments
        method: GET
        description: Absentify Get All Departments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: departmentcreatedepartment
        method: POST
        description: Absentify Create a Department
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
