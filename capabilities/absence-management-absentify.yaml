$schema: https://naftiko.com/schemas/capability/v1
$id: https://raw.githubusercontent.com/api-evangelist/absentify/main/capabilities/absence-management-absentify.yaml
title: Absence Management with Absentify
description: >-
  Workflow-oriented capability compositions for managing employee absences using the
  Absentify API. Provides MCP tools for submitting, reviewing, and reporting on
  leave requests.
provider: absentify
version: "1.0"

tools:
  - name: absentify_list_members
    title: List Absentify Members
    description: Retrieve all workspace members for absence tracking
    capability: list-members
    inputs:
      - name: page
        type: integer
        description: Page number for pagination
      - name: limit
        type: integer
        description: Number of members per page

  - name: absentify_get_member
    title: Get Absentify Member
    description: Retrieve a specific member's profile and leave settings
    capability: get-member
    inputs:
      - name: id
        type: string
        required: true
        description: The member's unique identifier

  - name: absentify_create_member
    title: Create Absentify Member
    description: Add a new employee to the workspace
    capability: create-member
    inputs:
      - name: name
        type: string
        required: true
      - name: email
        type: string
        required: true
      - name: department_id
        type: string
      - name: employment_start
        type: string
        format: date

  - name: absentify_list_departments
    title: List Absentify Departments
    description: Retrieve all organizational departments
    capability: list-departments

  - name: absentify_list_leave_types
    title: List Absentify Leave Types
    description: Retrieve all configured leave categories with their rules
    capability: list-leave-types

  - name: absentify_list_requests
    title: List Absence Requests
    description: Retrieve leave requests with optional filtering by member, status, or date range
    capability: list-requests
    inputs:
      - name: member_id
        type: string
        description: Filter by specific member
      - name: status
        type: string
        enum: [pending, approved, declined, cancelled]
        description: Filter by request status
      - name: start
        type: string
        format: date
        description: Filter requests starting from this date
      - name: end
        type: string
        format: date
        description: Filter requests ending on this date

  - name: absentify_create_request
    title: Create Absence Request
    description: Submit a new leave request on behalf of a member
    capability: create-request
    inputs:
      - name: member_id
        type: string
        required: true
      - name: leave_type_id
        type: string
        required: true
      - name: start
        type: string
        format: date
        required: true
      - name: end
        type: string
        format: date
        required: true
      - name: reason
        type: string
        description: Optional reason for the leave request

  - name: absentify_approve_request
    title: Approve Absence Request
    description: Approve a pending leave request
    capability: update-request-status
    inputs:
      - name: id
        type: string
        required: true
        description: The request's unique identifier
      - name: status
        type: string
        enum: [approved]
        default: approved

  - name: absentify_decline_request
    title: Decline Absence Request
    description: Decline a pending leave request with optional reason
    capability: update-request-status
    inputs:
      - name: id
        type: string
        required: true
      - name: status
        type: string
        enum: [declined]
        default: declined
      - name: reason
        type: string
        description: Reason for declining the request

  - name: absentify_list_absences_per_day
    title: List Daily Absences
    description: Retrieve individual absence days for a date range for reporting and payroll
    capability: list-absences-per-day
    inputs:
      - name: start
        type: string
        format: date
        required: true
        description: Start date of the reporting period
      - name: end
        type: string
        format: date
        required: true
        description: End date of the reporting period

  - name: absentify_get_workspace
    title: Get Absentify Workspace
    description: Retrieve workspace configuration including plan, settings, and fiscal year
    capability: get-workspace
