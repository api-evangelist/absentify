    Member:
      title: Member
      description: A member (employee) in the absentify workspace.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the member.
          example: '500123'
        custom_id:
          type: string
          description: Custom identifier for the member.
          example: EMP001
        name:
          type: string
          description: Name of the member.
          example: Jane Smith
        email:
          type: string
          format: email
          description: Email address of the member.
          example: jsmith@example.com
        status:
          type: string
          description: Current status of the member.
          example: ACTIVE
        is_admin:
          type: boolean
          description: Whether the member is an admin.
          example: false
        approval_process:
          type: string
          description: Approval process type for this member.
          example: CUSTOM
        employment_start_date:
          type: string
          format: date
          description: Employment start date.
          example: '2024-01-15'
        employment_end_date:
          type: string
          format: date
          nullable: true
          description: Employment end date if applicable.
          example:
        birthday:
          type: string
          format: date
          nullable: true
          description: Birthday of the member.
          example: '1990-06-15'
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the member was created.
          example: '2025-03-15T14:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the member was last updated.
          example: '2025-06-01T09:00:00Z'
    Department:
      title: Department
      description: A department in the absentify workspace.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the department.
          example: '500999'
        name:
          type: string
          description: Name of the department.
          example: Engineering
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the department was created.
          example: '2025-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the department was last updated.
          example: '2025-06-01T09:00:00Z'
    LeaveType:
      title: LeaveType
      description: A leave type defined in the absentify workspace.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the leave type.
          example: '500789'
        name:
          type: string
          description: Name of the leave type.
          example: Vacation
        leave_unit:
          type: string
          description: Unit for this leave type (days or hours).
          example: DAYS
        color:
          type: string
          description: Color code for this leave type.
          example: '#4CAF50'
        icon:
          type: string
          description: Icon for this leave type.
          example: beach
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the leave type was created.
          example: '2025-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the leave type was last updated.
          example: '2025-06-01T09:00:00Z'
    Request:
      title: Request
      description: A leave request in absentify.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the request.
          example: '500456'
        start:
          type: string
          format: date
          description: Start date of the request.
          example: '2025-06-01'
        start_at:
          type: string
          description: Time of day when the leave starts.
          example: morning
        end:
          type: string
          format: date
          description: End date of the request.
          example: '2025-06-05'
        end_at:
          type: string
          description: Time of day when the leave ends.
          example: afternoon
        status:
          type: string
          description: Current status of the request.
          example: APPROVED
        reason:
          type: string
          description: Reason for the leave request.
          example: Annual vacation
        duration:
          type: number
          description: Duration of the leave.
          example: 5
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the request was created.
          example: '2025-05-15T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the request was last updated.
          example: '2025-05-16T09:00:00Z'
    PublicHolidayCalendar:
      title: PublicHolidayCalendar
      description: A public holiday calendar in absentify.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the calendar.
          example: '500888'
        name:
          type: string
          description: Name of the public holiday calendar.
          example: United States Federal Holidays
        country:
          type: string
          description: Country code for the public holidays.
          example: US
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the calendar was created.
          example: '2025-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the calendar was last updated.
          example: '2025-06-01T09:00:00Z'
    Absence:
      title: Absence
      description: An absence entry for a specific date and member.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the absence.
          example: '500321'
        date:
          type: string
          format: date
          description: Date of the absence.
          example: '2025-06-02'
        duration:
          type: number
          description: Duration of the absence (0.5 for half day, 1 for full day).
          example: 1
        request_id:
          type: string
          description: ID of the associated leave request.
          example: '500456'
    Workspace:
      title: Workspace
      description: Workspace settings and configuration.
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the workspace.
          example: '500001'
        name:
          type: string
          description: Name of the workspace.
          example: Acme Corporation
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the workspace was created.
          example: '2024-01-01T00:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the workspace was last updated.
          example: '2025-06-01T09:00:00Z'
  securitySchemes:
    ApiKey:
      type: apiKey
      name: X-API-KEY
      in: header
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key from your absentify account settings. Requires Plus plan.
