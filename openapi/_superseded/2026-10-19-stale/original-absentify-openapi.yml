  /members/{id}/approvers:
    put:
      operationId: member-updateMemberApprovers
      summary: Absentify Update Approvers for a Member
      description: "\n        This endpoint allows updating the approvers for a specific member based on the chosen approval process.\n        Depending on the provided configuration:\n        - If Microsoft
        profile managers are used, department and custom approvers are ignored.\n        - If department settings are used, Microsoft profile managers and custom approvers are ignored.\n        - If custom
        approvers are provided, Microsoft profile managers and department settings are ignored.\n\n        **No Approver (Self-Approval):**\n        To set \"no approver\" for a member, provide an empty
        array: `approvers: []`.\n        The system will automatically configure the member as their own approver (self-approval),\n        which is internally recognized as \"no approver\" throughout the
        application.\n\n        The 'id' and 'approval_process' fields are always required.\n      "
      tags:
      - Members
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_process:
                  type: string
                  enum:
                  - Linear_all_have_to_agree
                  - Linear_one_has_to_agree
                  - Parallel_all_have_to_agree
                  - Parallel_one_has_to_agree
                microsoft_settings:
                  type: object
                  properties:
                    use_profile_managers:
                      type: boolean
                    profile_managers_level:
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                  required:
                  - use_profile_managers
                  - profile_managers_level
                department_settings:
                  type: object
                  properties:
                    use_department_settings:
                      type: boolean
                    department_id:
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - use_department_settings
                  - department_id
                approvers:
                  type: array
                  items:
                    type: object
                    properties:
                      member_id:
                        type: string
                      predecessor_manager_id:
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - member_id
                    - predecessor_manager_id
              required:
              - approval_process
