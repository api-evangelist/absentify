                  - type: 'null'
                custom_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                defaultAllowances:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      current_year:
                        type: number
                      next_year:
                        type: number
                      default:
                        type: boolean
                      disabled:
                        type: boolean
                    required:
                    - id
                    - current_year
                    - next_year
              required:
              - name
              - email
              - department_ids
              - employment_start_date
              - public_holiday_id
              - annual_allowance_current_year
              - annual_allowance_next_year
              - birthday
              - custom_id
              - defaultAllowances
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
