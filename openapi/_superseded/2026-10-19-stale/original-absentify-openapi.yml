                            - type: string
                            - type: 'null'
                        required:
                        - id
                        - custom_id
                        - name
                        - email
                        additionalProperties: false
                      date:
                        type: string
                      start_at:
                        anyOf:
                        - type: string
                          enum:
                          - morning
                          - afternoon
                        - type: 'null'
                      end_at:
                        anyOf:
                        - type: string
                          enum:
                          - lunchtime
                          - end_of_day
                        - type: 'null'
                      request:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            duration:
                              type: number
                            workday_absence_duration:
                              type: number
                            status:
                              anyOf:
                              - type: string
                              - type: 'null'
                            take_from_allowance:
                              type: boolean
                            allowance_type:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    type: string
                                  ignore_allowance_limit:
                                    type: boolean
                                  allowance_unit:
                                    type: string
                                    enum:
                                    - days
                                    - hours
                                required:
                                - id
                                - name
                                - ignore_allowance_limit
                                - allowance_unit
                                additionalProperties: false
                              - type: 'null'
                            leave_type:
                              anyOf:
                              - type: object
                                properties:
                                  name:
                                    type: string
                                  id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  leave_unit:
                                    type: string
                                    enum:
                                    - days
                                    - half_days
                                    - hours
                                    - minutes_30
                                    - minutes_15
                                    - minutes_10
                                    - minutes_5
                                    - minutes_1
                                required:
                                - name
                                - id
                                - leave_unit
                                additionalProperties: false
                              - type: 'null'
                          required:
                          - id
                          - duration
                          - workday_absence_duration
                          - status
                          - take_from_allowance
                          - allowance_type
                          - leave_type
                          additionalProperties: false
                        - type: 'null'
                      public_holiday_day:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            duration:
                              type: string
                            names:
                              type: array
                              items:
                                type: object
                                properties:
                                  language:
                                    type: string
                                  name:
                                    type: string
                                required:
                                - language
                                - name
                                additionalProperties: false
                          required:
                          - id
                          - duration
                          - names
                          additionalProperties: false
                        - type: 'null'
                    required:
                    - type
                    - member
                    - date
                    - start_at
                    - end_at
                    - request
                    - public_holiday_day
                    additionalProperties: false
                  - type: 'null'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    error.BAD_REQUEST:
      title: Invalid input data error (400)
      description: The error information
      example:
        code: BAD_REQUEST
        message: Invalid input data
        issues: []
      type: object
      properties:
        message:
          description: The error message
          example: Invalid input data
          type: string
        code:
          description: The error code
          example: BAD_REQUEST
          type: string
        issues:
          description: An array of issues that were responsible for the error
          example: []
          type: array
          items:
            type: object
            properties:
              message:
                type: string
            required:
            - message
            additionalProperties: false
      required:
      - message
      - code
      additionalProperties: false
