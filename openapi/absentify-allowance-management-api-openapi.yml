        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_assignment_id:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                  description: The assignment being replaced, from GET /members/{member_id}/rule-assignments.
                rule_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  description: The rule to move the member to.
                allowance_type_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                valid_from:
                  description: First day the new rule applies (inclusive), in YYYY-MM-DD format. Must be after the current assignment's start date.
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                valid_until:
                  description: Last day the new rule applies (inclusive), in YYYY-MM-DD format, or null for open-ended. To cover the member through 2026-08-31, send 2026-08-31.
                  anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: 'null'
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
