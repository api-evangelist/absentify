    post:
      operationId: allowanceRule-changeMemberRule
      summary: Move a member to another rule
      description: 'Ends the member''s current assignment on `valid_from` and starts the new rule on the same day, in one transaction. Prefer this over deleting and recreating assignments: it leaves neither a gap nor an overlap, and records the move as a single audit entry. A `valid_until` is only accepted on the day before the next assignment starts or on the member''s last employment day, so send null when nothing follows. Gaps or overlaps that predate this rule are tolerated, but the move may not widen them.'
