          - fr
          - hu
          - it
          - pl
          - pt
          - ru
          - es
          - tr
          - uk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      description: Translated into `locale` when one is given, otherwise into the API key owner's language, falling back to the stored name where no translation exists.
                    default_name:
                      type: string
                      description: The stored name, without any translation applied.
                    allowance_unit:
                      type: string
                      enum:
                      - days
                      - hours
                      description: Whether this type is counted in days or in minutes.
                    ignore_allowance_limit:
                      type: boolean
                      description: When true, members may book more than their balance and go negative.
                    default_rule_id:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: The rule a new member of this workspace is put on. A department default rule takes precedence over it.
                    default_rule_manually_managed:
                      type: boolean
                      description: When true, new members are managed manually unless their department selects a rule.
                    workspace_id:
                      type: string
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    translations:
                      type: array
                      items:
                        type: object
                        properties:
                          language:
                            type: string
                            description: Language code the name below is written in, e.g. `de`.
                          name:
                            type: string
                        required:
                        - language
                        - name
                        additionalProperties: false
                    leave_types:
                      type: array
                      items:
                        type: object
                        properties:
