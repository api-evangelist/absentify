openapi: 3.2.0
info:
  title: absentify CRUD Allowance Management API
  description: OpenAPI compliant REST API
  version: 1.0.0
servers:
- url: https://api.absentify.com/api/v1
tags:
- name: Allowance Management
paths:
  /allowance-types/{allowance_type_id}/rules:
    get:
      operationId: allowanceRule-listRules
      summary: List all rules for an allowance type
      description: Returns all allowance rules defined for the given allowance type, including the count of members currently assigned to each rule.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    accrual_month:
                      type: number
                    rule_amount:
                      type: number
                    accrual_cycle:
                      type: string
                      enum:
                      - month
                      - year
                      - biweek
                    accrual_anchor_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                    cycle_on_employment_start:
                      type: boolean
                    rule_duration:
                      anyOf:
                      - type: number
                      - type: 'null'
                    upfront_allocation:
                      type: boolean
                    proration_basis:
                      type: string
                      enum:
                      - month
                      - day
                      - full_month
                      - none
                    part_time_basis:
                      type: string
                      enum:
                      - none
                      - workdays
                      - hours
                      description: Scales every grant of this rule to the member's own working week. none = off; workdays = by the days worked per week; hours = by the hours worked per week. A member with no schedule of their own counts as full time.
                    part_time_reference:
                      anyOf:
                      - type: number
                      - type: 'null'
                      description: Days (workdays) or hours (hours) per week that count as full time. Required and greater than 0 when part_time_basis is not none; stored as null when it is none.
                    part_time_from:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: First day (inclusive) the scaling applies to. A grant for a year, month or two weeks that started earlier is not scaled. Null when part_time_basis is none.
                    allowance_type_id:
                      type: string
                    max_carry_forward:
                      anyOf:
                      - type: number
                      - type: 'null'
                    carry_forward_expiry_months:
                      anyOf:
                      - type: number
                      - type: 'null'
                    carry_forward_kept_after_expiry:
                      anyOf:
                      - type: number
                      - type: 'null'
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    _count:
                      type: object
                      properties:
                        member_allowance_rule_assignments:
                          type: number
                      required:
                      - member_allowance_rule_assignments
                      additionalProperties: false
                  required:
                  - id
                  - name
                  - accrual_month
                  - rule_amount
                  - accrual_cycle
                  - accrual_anchor_date
                  - cycle_on_employment_start
                  - rule_duration
                  - upfront_allocation
                  - proration_basis
                  - part_time_basis
                  - part_time_reference
                  - part_time_from
                  - allowance_type_id
                  - max_carry_forward
                  - carry_forward_expiry_months
                  - carry_forward_kept_after_expiry
                  - createdAt
                  - updatedAt
                  - _count
                  additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
    post:
      operationId: allowanceRule-createRule
      summary: Create a new allowance rule
      description: Creates a new allowance rule for the given allowance type. Rules define how much allowance members receive and how it accrues (monthly or yearly).
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                accrual_month:
                  type: integer
                  minimum: 0
                  maximum: 11
                  description: 0 = January, 11 = December
                rule_amount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100000
                  description: Allowance amount per accrual cycle, must be greater than 0. For day-based allowance types the value is in days; for hour-based allowance types the value is in MINUTES (e.g. 480 = 8 hours). A 0-amount (manual) rule is created by assigning a member to manage manually, not through this endpoint.
                accrual_cycle:
                  type: string
                  enum:
                  - month
                  - year
                  - biweek
                accrual_anchor_date:
                  description: Bi-weekly cycle anchor (YYYY-MM-DD); null = count from each member's start date
                  anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: 'null'
                cycle_on_employment_start:
                  default: false
                  description: 'Starts each allowance year on the member''s employment start date instead of accrual_month. Yearly rules only: a monthly or bi-weekly rule with true is rejected, so a PATCH that moves a rule with true away from accrual_cycle year must also send false.'
                  type: boolean
                rule_duration:
                  default: null
                  description: 'Per-accrual rolling expiry: each accrual is valid for this many months from its accrual date, then expires automatically (like time off in lieu). Min 1; null = off. Cannot be combined with any carry-forward setting, and is not allowed on a 0-amount (manual) rule.'
                  anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 1200
                  - type: 'null'
                upfront_allocation:
                  default: true
                  description: If true, full allowance is granted at start of cycle
                  type: boolean
                proration_basis:
                  default: month
                  description: How partial yearly rules are prorated. month = whole months count fully, the partial start or end month is prorated by day; day = calendar-day exact; full_month = only whole months count 1/12 each, a started month counts nothing; none = a rule year in which employment starts or ends grants the full yearly amount; every other partial year, such as a switch to another rule or an assignment that starts or ends during the year while employed, counts its months. Ignored for monthly and biweekly cycles. Defaults to month.
                  type: string
                  enum:
                  - month
                  - day
                  - full_month
                  - none
                max_carry_forward:
                  default: null
                  description: Hard cap on the amount carried into the next fiscal year, applied at the year boundary. null = unlimited (everything carries), 0 = nothing carries. For hour-based allowance types the value is in MINUTES.
                  anyOf:
                  - type: number
                    minimum: 0
                    maximum: 100000
                  - type: 'null'
                carry_forward_expiry_months:
                  default: null
                  description: How long carried-forward allowance stays usable in the new fiscal year. null = it never expires; N (>= 1) = usable until the last day of the Nth month after the fiscal year end, then forfeited (except carry_forward_kept_after_expiry).
                  anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 1200
                  - type: 'null'
                carry_forward_kept_after_expiry:
                  default: null
                  description: Amount of the carried-forward allowance that survives permanently after the expiry deadline. Only allowed when carry_forward_expiry_months is set; must be lower than max_carry_forward when both are set. null/0 = nothing survives. For hour-based allowance types the value is in MINUTES.
                  anyOf:
                  - type: number
                    minimum: 0
                    maximum: 100000
                  - type: 'null'
                part_time_basis:
                  default: none
                  description: Scales every grant of this rule to the member's own working week. none = off; workdays = by the days worked per week; hours = by the hours worked per week. A member with no schedule of their own counts as full time.
                  type: string
                  enum:
                  - none
                  - workdays
                  - hours
                part_time_reference:
                  default: null
                  description: Days (workdays) or hours (hours) per week that count as full time. Required and greater than 0 when part_time_basis is not none; stored as null when it is none.
                  anyOf:
                  - type: number
                    exclusiveMinimum: 0
                    maximum: 168
                  - type: 'null'
                part_time_from:
                  description: First day (inclusive, YYYY-MM-DD) the scaling applies to. A grant for a year, month or two weeks that started earlier is not scaled. A new date must not be before the first day of the current fiscal year. Without a date (null included), a new or newly scaling rule starts on that day and a rule that already scales keeps its stored date. Stored as null when part_time_basis is none.
                  anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: 'null'
              required:
              - name
              - accrual_month
              - rule_amount
              - accrual_cycle
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                - id
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /rules/{id}:
    patch:
      operationId: allowanceRule-updateRule
      summary: Update an allowance rule
      description: Updates an existing allowance rule. Only provide the fields you want to change. Changes are applied to all members subscribed to this rule.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                accrual_month:
                  type: integer
                  minimum: 0
                  maximum: 11
                rule_amount:
                  description: Allowance amount per accrual cycle, must be greater than 0. For hour-based allowance types the value is in MINUTES (e.g. 480 = 8 hours). Omit to leave a stored 0-amount (manual) rule unchanged.
                  type: number
                  exclusiveMinimum: 0
                  maximum: 100000
                accrual_cycle:
                  type: string
                  enum:
                  - month
                  - year
                  - biweek
                accrual_anchor_date:
                  anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: 'null'
                cycle_on_employment_start:
                  description: 'Starts each allowance year on the member''s employment start date instead of accrual_month. Yearly rules only: a monthly or bi-weekly rule with true is rejected, so a PATCH that moves a rule with true away from accrual_cycle year must also send false.'
                  type: boolean
                rule_duration:
                  description: Per-accrual rolling expiry in months (each accrual valid this many months from its accrual date). Min 1; null = off. Cannot be combined with any carry-forward setting, and is not allowed on a 0-amount (manual) rule.
                  anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 1200
                  - type: 'null'
                upfront_allocation:
                  type: boolean
                proration_basis:
                  description: How partial yearly rules are prorated. month = whole months count fully, the partial start or end month is prorated by day; day = calendar-day exact; full_month = only whole months count 1/12 each, a started month counts nothing; none = a rule year in which employment starts or ends grants the full yearly amount; every other partial year, such as a switch to another rule or an assignment that starts or ends during the year while employed, counts its months. Ignored for monthly and biweekly cycles.
                  type: string
                  enum:
                  - month
                  - day
                  - full_month
                  - none
                max_carry_forward:
                  description: Hard cap on the amount carried into the next fiscal year, applied at the year boundary. null = unlimited (everything carries), 0 = nothing carries. For hour-based allowance types the value is in MINUTES.
                  anyOf:
                  - type: number
                    minimum: 0
                    maximum: 100000
                  - type: 'null'
                carry_forward_expiry_months:
                  description: How long carried-forward allowance stays usable in the new fiscal year. null = it never expires; N (>= 1) = months after fiscal year end.
                  anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 1200
                  - type: 'null'
                carry_forward_kept_after_expiry:
                  description: Amount surviving permanently after the expiry deadline. Requires carry_forward_expiry_months; must be lower than max_carry_forward when both are set.
                  anyOf:
                  - type: number
                    minimum: 0
                    maximum: 100000
                  - type: 'null'
                part_time_basis:
                  description: Scales every grant of this rule to the member's own working week. none = off; workdays = by the days worked per week; hours = by the hours worked per week. A member with no schedule of their own counts as full time.
                  type: string
                  enum:
                  - none
                  - workdays
                  - hours
                part_time_reference:
                  description: Days (workdays) or hours (hours) per week that count as full time. Required and greater than 0 when part_time_basis is not none; stored as null when it is none.
                  anyOf:
                  - type: number
                    exclusiveMinimum: 0
                    maximum: 168
                  - type: 'null'
                part_time_from:
                  description: First day (inclusive, YYYY-MM-DD) the scaling applies to. A grant for a year, month or two weeks that started earlier is not scaled. A new date must not be before the first day of the current fiscal year. Without a date (null included), a new or newly scaling rule starts on that day and a rule that already scales keeps its stored date. Stored as null when part_time_basis is none.
                  anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: 'null'
                reason:
                  description: Why this rule is being changed — stored in the rule audit log.
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: number
                required:
                - count
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
    delete:
      operationId: allowanceRule-deleteRule
      summary: Delete an allowance rule
      description: Deletes an allowance rule. If members are assigned, you must provide reassign_to with the ID of another rule to move them to. Members move at the first fiscal-year start on or after today, never mid year.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: reassign_to
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      - in: query
        name: reason
        schema:
          type: string
          minLength: 3
          maxLength: 500
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                required:
                - success
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /members/{member_id}/rule-assignments:
    get:
      operationId: allowanceRule-listAssignments
      summary: List rule assignments for a member
      description: Returns all rule assignments for a member. Optionally filter by allowance type.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    rule_start_date:
                      description: 'First day the assignment itself applies (inclusive). This is the assignment''s own validity, which is independent of the member: it does not account for a member who joined after it began. Matches what POST and PATCH accept, so values can be round-tripped — use coverage_start_date to see when the member actually starts accruing.'
                      type: string
                    coverage_start_date:
                      description: 'First day this MEMBER actually accrues under the assignment (inclusive): rule_start_date, moved forward to the member''s employment_start_date when they joined after the assignment began and before it ended. For an assignment that ended on or before the member''s employment start, the member never accrued under it at all and this field simply equals rule_start_date (that state is detectable as rule_end_date <= employment_start_date). Read-only and derived — POST and PATCH do not accept it, and writing it back into rule_start_date would freeze a hire date that is still editable.'
                      type: string
                    rule_end_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                      description: Last day the rule applies (inclusive), or null for open-ended. Matches what POST and PATCH accept, so values can be round-tripped.
                    allowance_type_id:
                      type: string
                    rule_id:
                      type: string
                    rule:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        rule_amount:
                          type: number
                        accrual_cycle:
                          type: string
                          enum:
                          - month
                          - year
                          - biweek
                        accrual_month:
                          type: number
                        max_carry_forward:
                          anyOf:
                          - type: number
                          - type: 'null'
                      required:
                      - id
                      - name
                      - rule_amount
                      - accrual_cycle
                      - accrual_month
                      - max_carry_forward
                      additionalProperties: false
                  required:
                  - id
                  - rule_start_date
                  - coverage_start_date
                  - rule_end_date
                  - allowance_type_id
                  - rule_id
                  - rule
                  additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
    post:
      operationId: allowanceRule-createAssignment
      summary: Assign a member to an allowance rule
      description: Creates a new rule assignment for a member. Assignments for one allowance type form a chain, so an end date is only accepted on the day before the next assignment starts or on the member's last employment day; leave `rule_end_date` null when nothing follows. Gaps or overlaps that already existed are tolerated, but a write may not widen them. Allowance values are automatically recalculated.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                allowance_type_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                rule_start_date:
                  description: First day the rule applies (inclusive), in YYYY-MM-DD format.
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                rule_end_date:
                  description: Last day the rule applies (inclusive), in YYYY-MM-DD format, or null for open-ended. To cover a member through 2026-08-31, send 2026-08-31.
                  anyOf:
                  - type: string
                    pattern: ^\d{4}-\d{2}-\d{2}$
                  - type: 'null'
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
                  description: Why this assignment is being created — stored in the rule audit log.
              required:
              - rule_id
              - allowance_type_id
              - rule_start_date
              - reason
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                required:
                - id
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /rule-assignments/{id}:
    patch:
      operationId: allowanceRule-updateAssignment
      summary: Update a rule assignment
