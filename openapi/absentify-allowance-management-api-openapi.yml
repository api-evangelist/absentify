  /rules/{rule_id}/audit-log:
    get:
      operationId: allowanceRule-getRuleAuditLog
      summary: Read the audit log of a rule
      description: Every recorded change to this rule and to its assignments, newest first. A member moving to another rule is filed under the rule they moved TO, with the previous rule in `changes.from_rule_id`.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: rule_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: take
        schema:
          default: 100
          type: integer
          minimum: 1
          maximum: 200
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        createdAt:
                          type: string
                        rule_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        allowance_type_id:
                          type: string
                        event_type:
                          type: string
                          enum:
                          - RULE_CREATED
                          - RULE_UPDATED
                          - RULE_DELETED
                          - ASSIGNMENT_CREATED
                          - ASSIGNMENT_UPDATED
                          - ASSIGNMENT_DELETED
                          - MEMBER_RULE_CHANGED
                          - DEFAULT_RULE_CHANGED
                        actor_member_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: Null once the member who made the change has been deleted.
                        member_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: 'Set on assignment-level events: the member they affected.'
                        comment:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The reason given for the change.
