  /allowances/{id}/revert-carryover-override:
    post:
      operationId: memberAllowance-revertCarryoverOverride
      summary: Let the carry-over be computed again
      description: Drops a hand-set carry-over for one year and recomputes the member's allowances from the previous year again, before the call returns. Does nothing when the carry-over was never overridden. The id is the `member_allowance_id` from GET /members/{member_id}/allowance-breakdown.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  year:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  brought_forward:
                    type: number
                    description: The value from BEFORE the revert, as confirmation of what was dropped. Re-read GET /members/{member_id}/allowances for the recomputed figure.
                  overwrite_brought_forward:
                    type: boolean
                required:
                - id
                - year
                - brought_forward
                - overwrite_brought_forward
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
