  /members/{member_id}/allowances:
    get:
      operationId: memberAllowance-listMemberAllowances
      summary: List a member's allowances
      description: Every fiscal year of every allowance type the member can use, oldest first. Allowance types that are switched off for this member are left out. This is the read side of the deprecated PUT /members/{id}/allowance/{allowance_type_id}/{year}.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: year
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - de
          - fr
          - hu
          - it
          - pl
          - pt
          - ru
          - es
          - tr
          - uk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    member_id:
                      type: string
                    allowance_type_id:
                      type: string
                    year:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    start:
                      description: First day of the fiscal year (inclusive).
                      type: string
                    end:
                      description: Last day of the fiscal year (inclusive).
                      type: string
                    allowance:
                      type: number
                      description: 'The entitlement of this year: `rule_allowance` plus `adjustments`. Same meaning as the `allowance` field on GET /members/{id}.'
                    rule_allowance:
                      type: number
                      description: The part of the entitlement the allowance rule granted. For a year still on the pre-rules data it holds the stored entitlement, and `adjustments` is 0.
                    adjustments:
                      type: number
                      description: The part that came from manual adjustments, overtime compensation excluded.
                    brought_forward:
                      type: number
                      description: Carried over from the previous year into this one.
                    overwrite_brought_forward:
                      type: boolean
                      description: True when an admin set the carry-over by hand instead of letting it be computed.
                    compensatory_time_off:
                      type: number
                      description: 'Compensatory time off of this year, including approved overtime credits. Days for day-based allowance types, MINUTES for hour-based ones. On an allowance type with overtime logging, or with credited overtime in that year, it cannot be changed through PUT /members/{id}/allowance/{allowance_type_id}/{year}: log overtime with POST /overtime-entries instead.'
                    taken:
                      type: number
                      description: Booked and approved out of this year.
                    remaining:
                      type: number
                      description: What is left to book.
                    carry_over:
                      type: number
                      description: Compatibility alias for allowance carried over from the previous year into this one.
                    will_expire:
                      type: number
                      description: Of `remaining`, how much expires later this year.
                    expired:
                      type: number
                      description: How much has already expired this year.
                    carry_forward_deadline:
                      description: The day carried-over balance expires.
                      type: string
                    expiring_adjustments:
                      anyOf:
                      - type: object
                        properties:
                          amount:
                            type: number
                          earliest_expiry:
                            description: The LAST day (inclusive) the soonest-expiring of them can still be used, the same value POST /members/{member_id}/adjustments takes.
                            type: string
                        required:
                        - amount
                        - earliest_expiry
                        additionalProperties: false
                      - type: 'null'
                      description: Positive adjustments of this year that expire in the future, if any. Always null when the `year` filter is used.
                    allowance_type:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                          description: Translated into `locale` when one is given, otherwise into the API key owner's language, falling back to the stored name.
                        default_name:
                          type: string
                        allowance_unit:
                          type: string
                          enum:
                          - days
                          - hours
                      required:
                      - id
                      - name
                      - default_name
                      - allowance_unit
                      additionalProperties: false
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                  required:
                  - id
                  - member_id
                  - allowance_type_id
                  - year
                  - start
                  - end
                  - allowance
                  - rule_allowance
                  - adjustments
                  - brought_forward
                  - overwrite_brought_forward
                  - compensatory_time_off
                  - taken
                  - remaining
                  - carry_over
                  - will_expire
                  - expired
                  - carry_forward_deadline
                  - expiring_adjustments
                  - allowance_type
                  - createdAt
                  - updatedAt
                  additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /members/{member_id}/allowance-audit-log:
    get:
      operationId: memberAllowance-getAuditLog
      summary: Read a member's allowance history
      description: 'Every manual change to this member''s allowance for one allowance type, newest first: hand-set balances, carry-over overrides and deleted adjustments. Rule changes are not in here, they are in GET /members/{member_id}/rule-audit-log.'
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: year
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                    createdAt:
                      type: string
                    year:
                      type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    event_type:
                      type: string
                      enum:
                      - BROUGHT_FORWARD_OVERRIDE_SET
                      - BROUGHT_FORWARD_OVERRIDE_REVERTED
                      - ALLOWANCE_MANUALLY_EDITED
                      - ALLOWANCE_LEGACY_EDITED
                      - ADJUSTMENT_DELETED
                    old_allowance:
                      anyOf:
                      - type: number
                      - type: 'null'
                    new_allowance:
                      anyOf:
                      - type: number
                      - type: 'null'
                    old_brought_forward:
                      anyOf:
                      - type: number
                      - type: 'null'
                    new_brought_forward:
                      anyOf:
                      - type: number
                      - type: 'null'
                    old_compensatory_time_off:
                      anyOf:
                      - type: number
                      - type: 'null'
                    new_compensatory_time_off:
                      anyOf:
                      - type: number
                      - type: 'null'
                    old_overwrite_brought_forward:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    new_overwrite_brought_forward:
                      anyOf:
                      - type: boolean
                      - type: 'null'
                    delta_allowance:
                      anyOf:
                      - type: number
                      - type: 'null'
                      description: Set instead of the old/new pair on entries migrated from the pre-rules history, which only recorded a difference.
                    delta_brought_forward:
                      anyOf:
                      - type: number
                      - type: 'null'
                    delta_compensatory_time_off:
                      anyOf:
                      - type: number
                      - type: 'null'
                    comment:
                      anyOf:
                      - type: string
                      - type: 'null'
                    actor:
                      anyOf:
                      - type: object
                        properties:
                          name:
                            anyOf:
                            - type: string
                            - type: 'null'
                          email:
                            anyOf:
                            - type: string
                            - type: 'null'
                        required:
                        - name
                        - email
                        additionalProperties: false
                      - type: 'null'
                      description: Who made the change; null once that member has been deleted.
                  required:
                  - id
                  - createdAt
                  - year
                  - event_type
                  - old_allowance
                  - new_allowance
                  - old_brought_forward
                  - new_brought_forward
                  - old_compensatory_time_off
                  - new_compensatory_time_off
                  - old_overwrite_brought_forward
                  - new_overwrite_brought_forward
                  - delta_allowance
                  - delta_brought_forward
                  - delta_compensatory_time_off
                  - comment
                  - actor
                  additionalProperties: false
                description: Capped at the 200 newest entries.
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
