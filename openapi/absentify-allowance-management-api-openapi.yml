            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /members/{member_id}/allowance-breakdown:
    get:
      operationId: memberAllowance-getBreakdown
      summary: Explain one year of a member's allowance
      description: 'How the figures of one fiscal year came about: which rule was active, what accrued month by month, what was carried over, what expired and what was booked. This is the calculation the app shows in the ledger.'
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: year
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: The fiscal year to explain.
        required: true
        description: The fiscal year to explain.
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - de
          - fr
          - hu
          - it
          - pl
          - pt
          - ru
          - es
          - tr
          - uk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  legacy_unmigrated:
                    type: boolean
                    description: 'True when this member has not been moved to the rules engine yet. Every other field is then null or empty: there is no rule-based breakdown to report.'
                  no_allowance_for_year:
                    type: boolean
                    description: True when the member has no allowance of this type in this year at all, for instance because no rule ever covered it. Every other field is then null or empty.
                  member_allowance_id:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The id to pass to POST /allowances/{id}/revert-carryover-override.
                  fiscal_year_start_month:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                    description: 0 = January, matching the workspace setting.
                  active_rule:
                    anyOf:
                    - type: object
                      properties:
                        name:
                          type: string
                        amount:
                          type: number
                          description: The rule's own amount per cycle, before any part-time adjustment. What this member was granted is in `allowance`.
                        cycle:
                          type: string
                          description: How often the rule grants, e.g. `monthly`.
                      required:
                      - name
                      - amount
                      - cycle
                      additionalProperties: false
                    - type: 'null'
                    description: The rule that governed this year, if any.
                  allowance:
                    type: number
                    description: The rule-granted entitlement after rounding.
                  raw_allowance:
                    type: number
                    description: The same figure before rounding.
                  rounding_increment:
                    anyOf:
                    - type: number
                    - type: 'null'
                    description: What the entitlement was rounded up to, e.g. 0.5 days.
                  rounding_mode:
                    anyOf:
                    - type: string
                      enum:
                      - increment
                      - half_day_threshold
                    - type: 'null'
                    description: 'How the entitlement is rounded: up to `rounding_increment`, or a fraction of half a day or more up to a full day.'
                  rounding_delta:
                    type: number
                    description: 'How much the rounding added: `allowance` minus `raw_allowance`.'
                  adjustments:
                    type: number
                    description: The manual adjustments of this year.
                  brought_forward:
                    type: number
                  overwrite_brought_forward:
                    type: boolean
                  taken:
                    type: number
                  remaining:
                    type: number
                  will_expire:
                    type: number
                  expired:
                    type: number
                  expiration:
                    type: number
                  carry_forward_deadline:
                    anyOf:
                    - type: string
                    - type: 'null'
                  next_credit_expiry:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The next day on which part of the balance expires.
                  credit_expiration_past:
                    type: number
                    description: Already expired out of the dated credits.
                  credit_expiration_future:
                    type: number
                    description: Still to expire out of them, later this year.
                  monthly_accruals:
                    type: array
                    items:
                      type: object
                      properties:
                        month:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                          description: 0-based index within the fiscal year, not the calendar.
                        amount:
                          type: number
                        earned:
                          type: boolean
                          description: False for a month that has not accrued yet.
                        ruleName:
                          type: string
                      required:
                      - month
                      - amount
                      - earned
                      additionalProperties: false
                    description: Empty when the year accrued in one go rather than per month.
                  carry_forward_detail:
                    anyOf:
                    - type: object
                      properties:
                        previous_remaining:
                          type: number
                          description: What was left at the end of the previous year.
                        carried:
                          type: number
                          description: How much of it was carried over.
                        expired:
                          type: number
                        deadline:
                          anyOf:
                          - type: string
                          - type: 'null'
                        expiry_months:
                          anyOf:
                          - type: number
                          - type: 'null'
                          description: How long carry-over survives; null means it never expires.
                        max_carry_forward:
                          anyOf:
                          - type: number
                          - type: 'null'
                        kept_after_expiry:
                          anyOf:
                          - type: number
                          - type: 'null'
                        computed_carried:
                          anyOf:
                          - type: number
                          - type: 'null'
                          description: What the engine would have carried over. Only set when an admin overrode the carry-over, so the two can be compared.
                      required:
                      - previous_remaining
                      - carried
                      - expired
                      - deadline
                      - expiry_months
                      - max_carry_forward
                      - kept_after_expiry
                      - computed_carried
                      additionalProperties: false
                    - type: 'null'
                    description: Null for the member's first year, which carries nothing over.
                  deductions:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                        amount:
                          type: number
                        request_id:
                          type: string
                        leave_type_id:
                          type: string
                        leave_type_name:
                          type: string
                          description: Translated into `locale` when one is given, otherwise the stored name.
                        request_start:
                          type: string
                        request_end:
                          type: string
                      required:
                      - date
                      - amount
                      - request_id
                      - leave_type_id
                      - leave_type_name
                      - request_start
                      - request_end
                      additionalProperties: false
                    description: What was booked out of this year, oldest first.
                  adjustment_details:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        amount:
                          type: number
                        date:
                          type: string
                        expiry_date:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The LAST day (inclusive) these days can still be used, the same value POST /members/{member_id}/adjustments takes. Null when they never expire.
                        comment:
                          type: string
                        is_expired:
                          type: boolean
                        is_overtime:
                          type: boolean
                          description: True when the adjustment is overtime compensation.
                        created_by:
                          anyOf:
                          - type: object
                            properties:
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - name
                            - email
                            additionalProperties: false
                          - type: 'null'
                      required:
                      - id
                      - amount
                      - date
                      - expiry_date
                      - comment
                      - is_expired
                      - is_overtime
                      - created_by
                      additionalProperties: false
                    description: The individual adjustments that make up `adjustments`.
                required:
                - legacy_unmigrated
                - no_allowance_for_year
                - member_allowance_id
                - fiscal_year_start_month
                - active_rule
                - allowance
                - raw_allowance
                - rounding_increment
                - rounding_mode
                - rounding_delta
                - adjustments
                - brought_forward
                - overwrite_brought_forward
                - taken
                - remaining
                - will_expire
                - expired
                - expiration
                - carry_forward_deadline
