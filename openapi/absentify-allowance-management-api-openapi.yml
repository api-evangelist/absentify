    get:
      operationId: allowanceType-listAllowanceTypes
      summary: List all allowance types
      description: Returns every allowance type of the workspace, in the order they are shown in the app. The ids returned here are the `allowance_type_id` every rule, rule assignment and adjustment endpoint expects.
      tags:
      - Allowance Management
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
