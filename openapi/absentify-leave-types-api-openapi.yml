                            type: string
                          name:
                            anyOf:
                            - type: string
                            - type: 'null'
                          email:
                            anyOf:
                            - type: string
                            - type: 'null'
                        required:
                        - id
                        - name
                        - email
                        additionalProperties: false
                      - type: 'null'
                    maximum_absent:
                      type: boolean
                    leave_unit:
                      type: string
                      enum:
                      - days
                      - half_days
                      - hours
                      - minutes_30
                      - minutes_15
                      - minutes_10
                      - minutes_5
                      - minutes_1
                    position:
                      type: number
                    take_from_allowance:
                      type: boolean
                    privacy_hide_leavetype:
                      type: boolean
                    outlook_synchronization_show_as:
                      type: string
                      enum:
                      - free
                      - tentative
                      - busy
                      - oof
                      - workingElsewhere
                      - unknown
                    outlook_synchronization_subject:
                      anyOf:
                      - type: string
                      - type: 'null'
                    allowance_type:
                      anyOf:
                      - type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                            description: Translated into `locale` when one is given and a translation exists, otherwise the stored name.
                          default_name:
                            type: string
                            description: The stored name, without any translation applied.
                          ignore_allowance_limit:
                            type: boolean
                          allowance_unit:
                            type: string
                            enum:
                            - days
                            - hours
                        required:
                        - id
                        - name
                        - default_name
                        - ignore_allowance_limit
                        - allowance_unit
                        additionalProperties: false
                      - type: 'null'
                    counts_as_leave:
                      type: boolean
                    allow_representative_overlap:
                      type: boolean
                    allow_request_changes:
                      type: boolean
                      description: Whether pending and approved requests of this leave type can be changed.
                    request_shortening_needs_approval:
                      type: boolean
                      description: 'Shortening an approved request needs approval from its approvers when this is on. Off by default: a shortened request applies at once and the days go back to the allowance. Extending or moving always needs approval.'
                  required:
                  - id
                  - name
                  - default_name
                  - createdAt
                  - updatedAt
                  - color
                  - icon
                  - needs_approval
                  - deleted
                  - deleted_at
                  - deleted_by
                  - maximum_absent
                  - leave_unit
                  - position
