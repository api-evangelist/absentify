    put:
      operationId: leaveTypes-updateLeaveType
      summary: Update a leave type
      description: Update a leave type. Omitted fields keep their current value, so a request that only sends `name` renames the leave type and changes nothing else.
      tags:
      - Leave types
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                color:
                  type: string
                needs_approval:
                  type: boolean
                maximum_absent:
                  type: boolean
                leave_unit:
                  description: 'When `take_from_allowance` is true, the unit follows the allowance: an hour or minute unit is saved as `days` for a days-based allowance, and `days` or `half_days` is saved as `hours` for an hours-based allowance. Switching between day and hour units is rejected while the leave type has requests that are not canceled or declined.'
                  type: string
                  enum:
                  - days
                  - half_days
                  - hours
                  - minutes_30
                  - minutes_15
                  - minutes_10
                  - minutes_5
                  - minutes_1
                position:
                  type: integer
                  minimum: -9007199254740991
                  maximum: 9007199254740991
                take_from_allowance:
                  type: boolean
                privacy_hide_leavetype:
                  type: boolean
                outlook_synchronization_show_as:
                  type: string
                  enum:
                  - free
                  - tentative
                  - busy
                  - oof
                  - workingElsewhere
                  - unknown
                outlook_synchronization_subject:
                  anyOf:
                  - type: string
                  - type: 'null'
                icon:
                  type: string
                  enum:
                  - NoIcon
                  - Umbrella
                  - Anchor
                  - Archive
                  - Award
                  - Briefcase
                  - Calendar
                  - Cast
                  - Clock
                  - Coffee
                  - Compass
                  - Battery
                  - Emoji
                  - Gift
                  - Frown
