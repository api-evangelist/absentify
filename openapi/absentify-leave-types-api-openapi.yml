          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - de
          - fr
          - hu
          - it
          - pl
          - pt
          - ru
          - es
          - tr
          - uk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                      description: Translated into `locale` when one is given and a translation exists, otherwise the stored name.
                    default_name:
                      type: string
                      description: The stored name, without any translation applied.
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    color:
