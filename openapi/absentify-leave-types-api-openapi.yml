                  - Bike
                  - Waves
                  - Snowflake
                  - Ship
                  - Map
                  - Camera
                  - Sunset
                  - Thermometer
                  - Pill
                  - Stethoscope
                  - HeartPulse
                  - Hospital
                  - Bandage
                  - Brain
                  - Syringe
                  - Bed
                  - Ambulance
                  - Eye
                  - Accessibility
                  - Activity
                  - Baby
                  - Heart
                  - HeartHandshake
                  - Dog
                  - Truck
                  - Milk
                  - HandHeart
                  - ToyBrick
                  - Cake
                  - Laptop
                  - Building2
                  - Presentation
                  - Car
                  - TrainFront
                  - RotateCcw
                  - Headset
                  - Phone
                  - HardHat
                  - Wrench
                  - Globe
                  - MapPin
                  - GraduationCap
                  - BookOpen
                  - School
                  - Languages
                  - Lightbulb
                  - PenLine
                  - PartyPopper
                  - Gem
                  - Flower2
                  - Landmark
                  - Vote
                  - Shield
                  - Church
                  - HandHelping
                  - Scale
                  - Siren
                  - Trophy
                  - Star
                  - Timer
                  - Hourglass
                  - CalendarOff
                  - Moon
                  - AlarmClock
                  - Sunrise
                  - CalendarDays
                  - CalendarHeart
                  - Megaphone
                  - CloudLightning
                  - Leaf
                  - Lock
                  - Ban
                  - CircleHelp
                reason_mandatory:
                  type: boolean
                reason_hint_text:
                  anyOf:
                  - type: string
                  - type: 'null'
                allowance_type_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                sync_option:
                  type: string
                  enum:
                  - Disabled
                  - All
                  - OnlyApproved
                counts_as_leave:
                  type: boolean
                allow_representative_overlap:
                  type: boolean
                allow_request_changes:
                  description: Whether pending and approved requests of this leave type can be changed.
                  type: boolean
                request_shortening_needs_approval:
                  description: 'Shortening an approved request needs approval from its approvers when this is on. Off by default: a shortened request applies at once and the days go back to the allowance. Extending or moving always needs approval.'
                  type: boolean
                translations:
                  description: Replaces the stored translations. Omit the field to leave them untouched.
                  type: array
