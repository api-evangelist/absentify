openapi: 3.2.0
info:
  title: absentify CRUD Workspace API
  description: OpenAPI compliant REST API
  version: 1.0.0
servers:
- url: https://api.absentify.com/api/v1
tags:
- name: Workspace
paths:
  /workspace:
    get:
      operationId: workspace-getCurrentWorkspace
      summary: Get current workspace settings
      tags:
      - Workspace
      security:
      - ApiKey: []
      parameters: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  createdAt:
                    type: string
                  global_date_format:
                    type: string
                  global_language:
                    type: string
                  global_time_format:
                    type: string
                    enum:
                    - H12
                    - H24
                  global_timezone:
                    type: string
                  global_week_start:
                    type: string
                  global_name_format:
                    type: string
                    enum:
                    - Microsoft_DisplayName
                    - First
                    - Last
                    - FirstLast
                    - LastFirst
                  name:
                    type: string
                  updatedAt:
                    type: string
                  privacy_show_calendarview:
                    type: boolean
                  privacy_show_otherdepartments:
                    type: boolean
                  privacy_show_absences_in_past:
                    type: boolean
                  fiscal_year_start_month:
                    type: integer
                    minimum: 0
                    maximum: 11
                required:
                - id
                - createdAt
                - global_date_format
                - global_language
                - global_time_format
                - global_timezone
                - global_week_start
                - global_name_format
                - name
                - updatedAt
                - privacy_show_calendarview
                - privacy_show_otherdepartments
                - privacy_show_absences_in_past
                - fiscal_year_start_month
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
    put:
      operationId: workspace-updateSettings
      summary: Update the workspace settings
      tags:
      - Workspace
      security:
      - ApiKey: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 191
                global_name_format:
                  type: string
                  enum:
                  - Microsoft_DisplayName
                  - First
                  - Last
                  - FirstLast
                  - LastFirst
                privacy_show_calendarview:
                  type: boolean
                privacy_show_otherdepartments:
                  type: boolean
                privacy_show_absences_in_past:
                  type: boolean
                display_logo:
                  type: string
                  enum:
                  - ShowLogoAndName
                  - ShowLogo
                allow_manager_past_request_management:
                  type: boolean
                fiscal_year_start_month:
                  description: 'Must match the current value. A different value returns 412: change the fiscal year start in the organization settings, where the allowance impact is reviewed first.'
                  type: integer
                  minimum: 0
                  maximum: 11
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
