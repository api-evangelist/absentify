  /members/{id}/representatives:
    put:
      operationId: member-updateMemberRepresentatives
      summary: Absentify Update Representatives for a Member
      description: "\n        This endpoint allows updating the representatives for a specific member.\n        It also configures how representative approvals work for this member.\n        The 'id', 'representative_approval_process', 'member_can_reorder_representatives',\n        'member_can_choose_representatives', 'required_representatives_count', and 'representatives' fields are always required.\n      "
      tags:
      - Members
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                representative_approval_process:
                  type: string
                  enum:
                  - Linear
                  - Parallel
                member_can_reorder_representatives:
                  type: boolean
                member_can_choose_representatives:
                  type: boolean
                required_representatives_count:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                representatives:
                  type: array
                  items:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
              required:
              - representative_approval_process
              - member_can_reorder_representatives
              - member_can_choose_representatives
              - required_representatives_count
              - representatives
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        '400':
