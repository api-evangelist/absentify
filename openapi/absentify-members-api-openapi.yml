                            - Manager
                          is_hidden:
                            type: boolean
                        required:
                        - id
                        - name
                        - manager_type
                        - is_hidden
                        additionalProperties: false
                    is_admin:
                      type: boolean
                    has_approvers:
                      type: array
                      items:
                        type: object
                        properties:
                          member:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - id
                            - name
                            - email
                            additionalProperties: false
                        required:
                        - member
                        additionalProperties: false
                    approver_config:
