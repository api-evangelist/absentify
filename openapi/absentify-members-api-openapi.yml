openapi: 3.1.0
info:
  title: Absentify Absences Members API
  description: 'The Absentify REST API provides comprehensive absence management capabilities for Microsoft 365-integrated organizations. Manage members, departments, leave types, requests, allowances, public holidays, and workspace settings. The API requires the Plus plan and uses API key authentication. Rate limit: 150 requests per second per IP.'
  version: 1.0.0
  contact:
    url: https://absentify.com/docs
    email: support@absentify.com
  license:
    name: Proprietary
    url: https://absentify.com/terms-and-conditions
  x-generated-from: official-openapi-spec
servers:
- url: https://api.absentify.com/api/v1
tags:
- name: Members
paths:
  /members:
    get:
      operationId: member-getMembers
      summary: Absentify Get All Members
      description: Get all members with optional filters for departments, status, employment dates, admin status, approval process, approvers, allowance types, name, birthday month, and manager type
      tags:
      - Members
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: department_ids
        schema:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      - in: query
        name: status
        schema:
          type: string
          enum:
          - INACTIVE
          - ACTIVE
          - ARCHIVED
      - in: query
        name: employment_start_date_from
        schema:
          type: string
      - in: query
        name: employment_start_date_to
        schema:
          type: string
      - in: query
        name: employment_end_date_from
        schema:
          type: string
      - in: query
        name: employment_end_date_to
        schema:
          type: string
      - in: query
        name: is_admin
        schema:
          type: boolean
      - in: query
        name: approval_process
        schema:
          type: string
          enum:
          - Linear_all_have_to_agree
          - Linear_one_has_to_agree
          - Parallel_all_have_to_agree
          - Parallel_one_has_to_agree
      - in: query
        name: has_approvers
        schema:
          type: boolean
      - in: query
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: birthday_month
        schema:
          type: number
          minimum: 1
          maximum: 12
      - in: query
        name: manager_type
        schema:
          type: string
          enum:
          - Member
          - Manager
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    custom_id:
                      anyOf:
                      - type: string
                      - type: 'null'
                    name:
                      anyOf:
                      - type: string
                      - type: 'null'
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    allowances:
                      type: array
                      items:
                        type: object
                        properties:
                          remaining:
                            type: number
                          brought_forward:
                            type: number
                          allowance:
                            type: number
                          taken:
                            type: number
                          year:
                            type: number
                          compensatory_time_off:
                            type: number
                          updatedAt:
                            type: string
                          createdAt:
                            type: string
                          id:
                            type: string
                          allowance_type:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              ignore_allowance_limit:
                                type: boolean
                            required:
                            - id
                            - name
                            - ignore_allowance_limit
                            additionalProperties: false
                        required:
                        - remaining
                        - brought_forward
                        - allowance
                        - taken
                        - year
                        - compensatory_time_off
                        - updatedAt
                        - createdAt
                        - id
                        - allowance_type
                        additionalProperties: false
                    allowance_type_configurations:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          allowance_type_id:
                            type: string
                          default:
                            type: boolean
                          disabled:
                            type: boolean
                        required:
                        - id
                        - allowance_type_id
                        - default
                        - disabled
                        additionalProperties: false
                    allowance_type_configurtaions:
                      description: 'DEPRECATED: Use allowance_type_configurations instead'
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          allowance_type_id:
                            type: string
                          default:
                            type: boolean
                          disabled:
                            type: boolean
                        required:
                        - id
                        - allowance_type_id
                        - default
                        - disabled
                        additionalProperties: false
                    approval_process:
                      type: string
                      enum:
                      - Linear_all_have_to_agree
                      - Linear_one_has_to_agree
                      - Parallel_all_have_to_agree
                      - Parallel_one_has_to_agree
                    status:
                      type: string
                      enum:
                      - INACTIVE
                      - ACTIVE
                      - ARCHIVED
                    birthday:
                      anyOf:
                      - type: string
                      - type: 'null'
                    employment_start_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                    employment_end_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                    email:
                      anyOf:
                      - type: string
                      - type: 'null'
                    departments:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          manager_type:
                            type: string
                            enum:
                            - Member
                            - Manager
                        required:
                        - id
                        - name
                        - manager_type
                        additionalProperties: false
                    is_admin:
                      type: boolean
                    has_approvers:
                      type: array
                      items:
                        type: object
                        properties:
                          member:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - id
                            - name
                            - email
                            additionalProperties: false
                        required:
                        - member
                        additionalProperties: false
                    approver_config:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - custom
                          - department
                          - microsoft
                        department_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        microsoft_sync_level:
                          anyOf:
                          - type: number
                          - type: 'null'
                      required:
                      - type
                      - department_id
                      - microsoft_sync_level
                      additionalProperties: false
                  required:
                  - id
                  - custom_id
                  - name
                  - createdAt
                  - updatedAt
                  - allowances
                  - allowance_type_configurations
                  - allowance_type_configurtaions
                  - approval_process
                  - status
                  - birthday
                  - employment_start_date
                  - employment_end_date
                  - email
                  - departments
                  - is_admin
                  - has_approvers
                  - approver_config
                  additionalProperties: false
