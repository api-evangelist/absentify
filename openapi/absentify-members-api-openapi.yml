                      - type: 'null'
                    name:
                      anyOf:
                      - type: string
                      - type: 'null'
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    allowances:
                      type: array
                      items:
                        type: object
                        properties:
                          remaining:
