                        - brought_forward
                        - allowance
                        - taken
                        - year
                        - compensatory_time_off
                        - updatedAt
                        - createdAt
                        - id
                        - allowance_type
                        additionalProperties: false
                    allowance_type_configurations:
                      type: array
