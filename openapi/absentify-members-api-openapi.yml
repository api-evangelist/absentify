                    format: email
                    pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  - type: 'null'
                department_ids:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    required:
                    - id
                employment_start_date:
                  anyOf:
                  - type: string
                  - type: 'null'
                public_holiday_id:
                  type: string
                annual_allowance_current_year:
                  type: number
                annual_allowance_next_year:
                  type: number
                birthday:
                  anyOf:
                  - type: string
                  - type: 'null'
                custom_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                defaultAllowances:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      current_year:
                        type: number
                      next_year:
                        type: number
                      default:
                        type: boolean
                      disabled:
                        type: boolean
                    required:
                    - id
                    - current_year
                    - next_year
              required:
              - name
              - email
              - department_ids
              - employment_start_date
              - public_holiday_id
              - annual_allowance_current_year
              - annual_allowance_next_year
              - birthday
              - custom_id
              - defaultAllowances
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        '400':
