  /members/{id}/approvers:
    put:
      operationId: member-updateMemberApprovers
      summary: Update approvers for a member
      description: 'This endpoint allows updating the approvers for a specific member based on the chosen approval process.

        Depending on the provided configuration:

        - If Microsoft profile managers are used, department and custom approvers are ignored.

        - If department settings are used, Microsoft profile managers and custom approvers are ignored.

        - If custom approvers are provided, Microsoft profile managers and department settings are ignored.


        **No Approver (Self-Approval):**

        To set "no approver" for a member, provide an empty array: `approvers: []`.

        The system will automatically configure the member as their own approver (self-approval),

        which is internally recognized as "no approver" throughout the application.


        The ''id'' and ''approval_process'' fields are always required.


        When Microsoft profile managers are used, this call returns 503 while the Microsoft directory is unavailable. That condition is temporary, so the request may be retried.'
      tags:
      - Members
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approval_process:
                  type: string
                  enum:
                  - Linear_all_have_to_agree
                  - Linear_one_has_to_agree
                  - Parallel_all_have_to_agree
                  - Parallel_one_has_to_agree
                  - Parallel_first_response_decides
                microsoft_settings:
                  type: object
                  properties:
                    use_profile_managers:
                      type: boolean
                    profile_managers_level:
                      anyOf:
                      - type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                      - type: 'null'
                  required:
                  - use_profile_managers
                  - profile_managers_level
                department_settings:
                  type: object
                  properties:
                    use_department_settings:
                      type: boolean
                    department_id:
                      anyOf:
                      - type: string
                      - type: 'null'
                  required:
                  - use_department_settings
                  - department_id
                approvers:
                  type: array
                  items:
                    type: object
                    properties:
                      member_id:
                        type: string
                      predecessor_manager_id:
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - member_id
                    - predecessor_manager_id
              required:
              - approval_process
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /members/{id}/allowance/{allowance_type_id}/{year}:
    put:
      operationId: member-updateMemberAllowance
      summary: Update a member's allowance (deprecated)
      description: 'DEPRECATED: Use the new rule-based endpoints instead: POST /allowance-types/{id}/rules to create rules, POST /members/{id}/rule-assignments to assign members, and POST /members/{id}/adjustments for one-off changes. IMPORTANT: for a member who is on the rule-based model, the `allowance` field is an absolute target for the fiscal year and is applied as a single API-owned adjustment holding the difference between it and the member''s rule entitlement. That adjustment is overwritten in place on every send, so sending the same value repeatedly changes nothing, and it is removed again as soon as the value matches the rule entitlement. Adjustments an administrator created in absentify are never counted into that difference and are never modified by this endpoint, so both can coexist: the effective allowance is the value you send plus whatever an administrator added on top. The adjustment is visible in the member''s allowance history, labelled as set via the API, and an administrator can delete it there to return the member to the plain rule entitlement. For a member who has no allowance rule at all, the effect depends on the workspace: in a workspace that was moved to the rule-based model, `allowance` is still accepted and has no effect; in a workspace that still runs on the flat model, `allowance` keeps its original behaviour and updates the stored value directly. `compensatory_time_off` and `brought_forward` keep working unchanged wherever the request is accepted, with one exception: on an allowance type with overtime logging, a changed `compensatory_time_off` rejects the whole request with 400 Bad Request before anything is written, because that balance comes from approved overtime (log it with POST /overtime-entries); sending the value the member already has stays accepted. The same applies once the type has credited overtime in the requested year, also after overtime logging was switched off. A field you omit keeps its stored value. While a workspace is locked — a migration is running, or it was rolled back to the flat model — this endpoint rejects the whole request with a conflict instead of applying part of it. If the member has no allowance for the requested type and year — no allowance rule assigns them that type for that year, or the year lies outside their employment period — the endpoint returns 404 Not Found; this is a permanent condition, so do not retry it. Note: For day-based allowance types, prorated allowances are automatically rounded up to the nearest bookable increment (0.5 days if half-day booking is enabled, otherwise 1.0 days). The `set_as_default` and `disabled` fields still work here, but they are the only reason some integrations still call this endpoint at all — use PUT /members/{member_id}/allowance-type-configurations/{allowance_type_id} instead, which enforces the same invariants as the UI.'
      tags:
      - Members
      security:
      - ApiKey: []
      deprecated: true
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
