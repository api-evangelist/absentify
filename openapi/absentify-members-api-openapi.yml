        name: year
        schema:
          type: number
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowance:
                  type: number
                compensatory_time_off:
                  type: number
                  description: 'Compensatory time off of this year, including approved overtime credits. Days for day-based allowance types, MINUTES for hour-based ones. On an allowance type with overtime logging, or with credited overtime in that year, it cannot be changed through PUT /members/{id}/allowance/{allowance_type_id}/{year}: log overtime with POST /overtime-entries instead. Sending the value the member already has is still accepted there.'
                brought_forward:
                  type: number
                reason:
                  type: string
                overwrite_brought_forward:
                  type: boolean
                set_as_default:
                  type: boolean
                disabled:
                  type: boolean
              required:
              - allowance
              - compensatory_time_off
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
