openapi: 3.2.0
info:
  title: absentify CRUD Members API
  description: OpenAPI compliant REST API
  version: 1.0.0
servers:
- url: https://api.absentify.com/api/v1
tags:
- name: Members
paths:
  /members:
    get:
      operationId: member-getMembers
      summary: Get all members
      description: Get all members with optional filters for departments, status, employment dates, admin status, approval process, approvers, allowance types, name, birthday month, and manager type
      tags:
      - Members
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: department_ids
        schema:
          type: array
          items:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      - in: query
        name: status
        schema:
          type: string
          enum:
          - INACTIVE
          - ACTIVE
          - ARCHIVED
      - in: query
        name: employment_start_date_from
        schema:
          description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used.
          type: string
      - in: query
        name: employment_start_date_to
        schema:
          description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used.
          type: string
      - in: query
        name: employment_end_date_from
        schema:
          description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used.
          type: string
      - in: query
        name: employment_end_date_to
        schema:
          description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used.
          type: string
      - in: query
        name: is_admin
        schema:
          type: boolean
      - in: query
        name: approval_process
        schema:
          type: string
          enum:
          - Linear_all_have_to_agree
          - Linear_one_has_to_agree
          - Parallel_all_have_to_agree
          - Parallel_one_has_to_agree
          - Parallel_first_response_decides
      - in: query
        name: has_approvers
        schema:
          type: boolean
      - in: query
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: birthday_month
        schema:
          type: number
          minimum: 1
          maximum: 12
      - in: query
        name: manager_type
        schema:
          type: string
          enum:
          - Member
          - Manager
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - de
          - fr
          - hu
          - it
          - pl
          - pt
          - ru
          - es
          - tr
          - uk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    custom_id:
                      anyOf:
                      - type: string
                      - type: 'null'
                    name:
                      anyOf:
                      - type: string
                      - type: 'null'
                    createdAt:
                      type: string
                    updatedAt:
                      type: string
                    allowances:
                      type: array
                      items:
                        type: object
                        properties:
                          remaining:
                            type: number
                          brought_forward:
                            type: number
                          allowance:
                            type: number
                            description: The bookable allowance for this period. For day-based allowance types, prorated values are rounded up to the nearest bookable increment (0.5 or 1.0 days).
                          taken:
                            type: number
                          year:
                            type: number
                          compensatory_time_off:
                            type: number
                            description: 'Compensatory time off of this year, including approved overtime credits. Days for day-based allowance types, MINUTES for hour-based ones. On an allowance type with overtime logging, or with credited overtime in that year, it cannot be changed through PUT /members/{id}/allowance/{allowance_type_id}/{year}: log overtime with POST /overtime-entries instead.'
                          updatedAt:
                            type: string
                          createdAt:
                            type: string
                          id:
                            type: string
                          allowance_type:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                                description: Translated into `locale` when one is given and a translation exists, otherwise the stored name. Webhook payloads always carry the stored name.
                              default_name:
                                type: string
                                description: The stored name, without any translation applied.
                              ignore_allowance_limit:
                                type: boolean
                            required:
                            - id
                            - name
                            - default_name
                            - ignore_allowance_limit
                            additionalProperties: false
                        required:
                        - remaining
                        - brought_forward
                        - allowance
                        - taken
                        - year
                        - compensatory_time_off
                        - updatedAt
                        - createdAt
                        - id
                        - allowance_type
                        additionalProperties: false
                    allowance_type_configurations:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          allowance_type_id:
                            type: string
                          default:
                            type: boolean
                          disabled:
                            type: boolean
                        required:
                        - id
                        - allowance_type_id
                        - default
                        - disabled
                        additionalProperties: false
                    allowance_type_configurtaions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          allowance_type_id:
                            type: string
                          default:
                            type: boolean
                          disabled:
                            type: boolean
                        required:
                        - id
                        - allowance_type_id
                        - default
                        - disabled
                        additionalProperties: false
                      description: 'DEPRECATED: Use allowance_type_configurations instead'
                    approval_process:
                      type: string
                      enum:
                      - Linear_all_have_to_agree
                      - Linear_one_has_to_agree
                      - Parallel_all_have_to_agree
                      - Parallel_one_has_to_agree
                      - Parallel_first_response_decides
                    status:
                      type: string
                      enum:
                      - INACTIVE
                      - ACTIVE
                      - ARCHIVED
                    birthday:
                      anyOf:
                      - type: string
                      - type: 'null'
                    employment_start_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                    employment_end_date:
                      anyOf:
                      - type: string
                      - type: 'null'
                    email:
                      anyOf:
                      - type: string
                      - type: 'null'
                    departments:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          manager_type:
                            type: string
                            enum:
                            - Member
                            - Manager
                          is_hidden:
                            type: boolean
                        required:
                        - id
                        - name
                        - manager_type
                        - is_hidden
                        additionalProperties: false
                    is_admin:
                      type: boolean
                    has_approvers:
                      type: array
                      items:
                        type: object
                        properties:
                          member:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - id
                            - name
                            - email
                            additionalProperties: false
                        required:
                        - member
                        additionalProperties: false
                    approver_config:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - custom
                          - department
                          - microsoft
                        department_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        microsoft_sync_level:
                          anyOf:
                          - type: number
                          - type: 'null'
                      required:
                      - type
                      - department_id
                      - microsoft_sync_level
                      additionalProperties: false
                  required:
                  - id
                  - custom_id
                  - name
                  - createdAt
                  - updatedAt
                  - allowances
                  - allowance_type_configurations
                  - allowance_type_configurtaions
                  - approval_process
                  - status
                  - birthday
                  - employment_start_date
                  - employment_end_date
                  - email
                  - departments
                  - is_admin
                  - has_approvers
                  - approver_config
                  additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
    post:
      operationId: member-inviteMember
      summary: Invite a member
      tags:
      - Members
      security:
      - ApiKey: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 255
                email:
                  anyOf:
                  - type: string
                    format: email
                    pattern: ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                  - type: 'null'
                department_ids:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                    required:
                    - id
                employment_start_date:
                  anyOf:
                  - description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used.
                    type: string
                  - type: 'null'
                public_holiday_id:
                  type: string
                annual_allowance_current_year:
                  type: number
                annual_allowance_next_year:
                  type: number
                birthday:
                  anyOf:
                  - description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used.
                    type: string
                  - type: 'null'
                custom_id:
                  anyOf:
                  - type: string
                  - type: 'null'
                defaultAllowances:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      current_year:
                        type: number
                      next_year:
                        type: number
                      default:
                        description: Preselect this allowance type for the member. Set it on exactly one entry; if no entry sets it, the member has no preselected type and sees no allowance in the calendar.
                        type: boolean
                      disabled:
                        description: Hide this allowance type from the member.
                        type: boolean
                    required:
                    - id
                    - current_year
                    - next_year
                  description: One entry per allowance type the member should get. `default` and `disabled` can be changed later via PUT /members/{member_id}/allowance-type-configurations/{allowance_type_id}.
              required:
              - name
              - email
              - department_ids
              - employment_start_date
              - public_holiday_id
              - annual_allowance_current_year
              - annual_allowance_next_year
              - birthday
              - custom_id
              - defaultAllowances
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
  /members/{id}:
