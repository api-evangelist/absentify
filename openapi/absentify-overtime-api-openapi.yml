openapi: 3.2.0
info:
  title: absentify CRUD Overtime API
  description: OpenAPI compliant REST API
  version: 1.0.0
servers:
- url: https://api.absentify.com/api/v1
tags:
- name: Overtime
paths:
  /overtime-entries:
    get:
      operationId: overtime-listOvertimeEntries
      summary: List overtime entries
      description: Overtime entries the API key's member may see, newest day first. Admins see every entry of the workspace; anyone else sees their own, the ones they approve or decided, the ones they logged for someone else, and those of the members they manage. Use `next_cursor` as `cursor` to read the next page. Workspaces without overtime logging answer with an error.
      tags:
      - Overtime
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: member_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - CANCELED
      - in: query
        name: allowance_type_id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
      - in: query
        name: date_from
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - in: query
        name: date_to
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 50
      - in: query
        name: cursor
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: -9007199254740991
                          maximum: 9007199254740991
                        member:
                          type: object
                          properties:
                            id:
                              type: string
                            custom_id:
                              anyOf:
                              - type: string
                              - type: 'null'
                            name:
                              anyOf:
                              - type: string
                              - type: 'null'
                            email:
                              anyOf:
                              - type: string
                              - type: 'null'
                          required:
                          - id
                          - custom_id
                          - name
                          - email
                          additionalProperties: false
                          description: The member the overtime was worked by.
                        allowance_type_id:
                          type: string
                        allowance_unit:
                          type: string
                          enum:
                          - days
                          - hours
                          description: The unit of the allowance type. Amounts are in days for `days` and in MINUTES for `hours`.
                        date:
                          type: string
                          description: The day the overtime was worked, `YYYY-MM-DD`.
                        amount:
                          type: number
                          description: The amount that was logged. Days (0.5 or 1) when `allowance_unit` is `days`, whole MINUTES when it is `hours` (for example 90 = 1 hour 30 minutes).
                        recognized_amount:
                          type: number
                          description: The amount an approver recognized, never more than `amount`. Equal to `amount` until someone lowers it. Days (0.5 or 1) when `allowance_unit` is `days`, whole MINUTES when it is `hours` (for example 90 = 1 hour 30 minutes).
                        day_kind:
                          type: string
                          enum:
                          - WORKDAY
                          - DAY_OFF
                          - PUBLIC_HOLIDAY
                          description: What kind of day it was when the entry was logged.
                        factor:
                          type: number
                          description: The multiplier applied to the recognized amount, fixed when the entry was logged.
                        credit_expiry_date:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The LAST day (inclusive, `YYYY-MM-DD`) the credit can still be used, or null when it does not expire.
                        comment:
                          anyOf:
                          - type: string
                          - type: 'null'
                        status:
                          type: string
                          enum:
                          - PENDING
                          - APPROVED
                          - DECLINED
                          - CANCELED
                        decided_by:
                          anyOf:
                          - type: object
                            properties:
                              id:
                                type: string
                              custom_id:
                                anyOf:
                                - type: string
                                - type: 'null'
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - id
                            - custom_id
                            - name
                            - email
                            additionalProperties: false
                          - type: 'null'
                          description: Who made the final decision. Null while the entry is open.
                        decided_at:
                          anyOf:
                          - type: string
                          - type: 'null'
                        created_by:
                          anyOf:
                          - type: object
                            properties:
                              id:
                                type: string
                              custom_id:
                                anyOf:
                                - type: string
                                - type: 'null'
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - id
                            - custom_id
                            - name
                            - email
                            additionalProperties: false
                          - type: 'null'
                          description: Who logged the entry. It differs from `member` when an admin logged it for someone else. Null for entries from before this was recorded and once that member has been deleted.
                        created_at:
                          type: string
                        canceled_at:
                          anyOf:
                          - type: string
                          - type: 'null'
                        canceled_by:
                          anyOf:
                          - type: object
                            properties:
                              id:
                                type: string
                              custom_id:
                                anyOf:
                                - type: string
                                - type: 'null'
                              name:
                                anyOf:
                                - type: string
                                - type: 'null'
                              email:
                                anyOf:
                                - type: string
                                - type: 'null'
                            required:
                            - id
                            - custom_id
                            - name
                            - email
                            additionalProperties: false
                          - type: 'null'
                          description: Who withdrew the entry. It differs from `member` when the member who logged it for them withdrew it. Null unless the status is CANCELED.
                        decline_reason:
                          anyOf:
                          - type: string
                          - type: 'null'
                          description: The reason given when the entry was declined, also when an admin declined for the approver.
                        credited_amount:
                          anyOf:
                          - type: number
                          - type: 'null'
                          description: 'What was credited to the allowance: the recognized amount times `factor`, as booked. Null while there is no credit. Days (rounded to two decimals, for example 0.75 or 1.5) when `allowance_unit` is `days`, whole MINUTES when it is `hours`.'
                        credit_removed:
                          type: boolean
                          description: True when the entry is approved but its credit was deleted from the allowance afterwards.
                      required:
                      - id
                      - member
                      - allowance_type_id
                      - allowance_unit
                      - date
                      - amount
                      - recognized_amount
                      - day_kind
                      - factor
                      - credit_expiry_date
                      - comment
                      - status
                      - decided_by
                      - decided_at
                      - created_by
                      - created_at
                      - canceled_at
                      - canceled_by
                      - decline_reason
                      - credited_amount
                      - credit_removed
                      additionalProperties: false
                  next_cursor:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                    description: Null on the last page.
                required:
                - items
                - next_cursor
                additionalProperties: false
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
          description: Insufficient access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.FORBIDDEN'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.NOT_FOUND'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.INTERNAL_SERVER_ERROR'
    post:
      operationId: overtime-createOvertimeEntry
      summary: Log overtime
      description: Logs overtime on an allowance type that has overtime logging switched on. The entry follows the member's normal approval chain and its approvers are notified; it is credited once approved. An admin can log for another active member of the workspace with `member_id`, otherwise it is logged for the API key's member. Send the same `submission_id` again to get the existing entry back instead of a second one. Fails with 409 when that `submission_id` was already used for the same member with a different allowance type, date or amount.
      tags:
      - Overtime
      security:
      - ApiKey: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_id:
                  description: The member the overtime was worked by. Defaults to the API key's member. Only admins may name someone else.
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                allowance_type_id:
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                  description: The allowance type the overtime is credited to. Overtime logging has to be switched on for it.
                date:
                  description: The day the overtime was worked, `YYYY-MM-DD`. Today or a day in the past.
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                amount:
                  type: number
                  description: Days (0.5 or 1) when `allowance_unit` is `days`, whole MINUTES when it is `hours` (for example 90 = 1 hour 30 minutes).
                comment:
                  description: A note for the approvers, at most 2500 characters.
                  anyOf:
                  - type: string
                    maxLength: 2500
                  - type: 'null'
                submission_id:
                  description: 'Makes a retry safe: the same value for the same member with the same allowance type, date and amount returns the existing entry. With a different allowance type, date or amount it fails with 409. Generated when omitted, in which case a retry logs a second entry.'
                  type: string
                  minLength: 8
                  maxLength: 64
              required:
              - allowance_type_id
              - date
              - amount
      responses:
        '200':
          description: Successful response
          content:
