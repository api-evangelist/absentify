                type: object
                properties:
                  id:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  member:
                    type: object
                    properties:
                      id:
                        type: string
                      custom_id:
                        anyOf:
                        - type: string
                        - type: 'null'
                      name:
                        anyOf:
                        - type: string
                        - type: 'null'
                      email:
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - id
                    - custom_id
                    - name
                    - email
                    additionalProperties: false
                    description: The member the overtime was worked by.
                  allowance_type_id:
                    type: string
                  allowance_unit:
                    type: string
                    enum:
                    - days
                    - hours
                    description: The unit of the allowance type. Amounts are in days for `days` and in MINUTES for `hours`.
                  date:
                    type: string
                    description: The day the overtime was worked, `YYYY-MM-DD`.
                  amount:
                    type: number
                    description: The amount that was logged. Days (0.5 or 1) when `allowance_unit` is `days`, whole MINUTES when it is `hours` (for example 90 = 1 hour 30 minutes).
                  recognized_amount:
                    type: number
                    description: The amount an approver recognized, never more than `amount`. Equal to `amount` until someone lowers it. Days (0.5 or 1) when `allowance_unit` is `days`, whole MINUTES when it is `hours` (for example 90 = 1 hour 30 minutes).
                  day_kind:
                    type: string
                    enum:
                    - WORKDAY
                    - DAY_OFF
                    - PUBLIC_HOLIDAY
                    description: What kind of day it was when the entry was logged.
                  factor:
                    type: number
                    description: The multiplier applied to the recognized amount, fixed when the entry was logged.
                  credit_expiry_date:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The LAST day (inclusive, `YYYY-MM-DD`) the credit can still be used, or null when it does not expire.
                  comment:
                    anyOf:
                    - type: string
                    - type: 'null'
                  status:
                    type: string
                    enum:
                    - PENDING
                    - APPROVED
                    - DECLINED
                    - CANCELED
                  decided_by:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        custom_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - id
                      - custom_id
                      - name
                      - email
                      additionalProperties: false
                    - type: 'null'
                    description: Who made the final decision. Null while the entry is open.
                  decided_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                  created_by:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        custom_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - id
                      - custom_id
                      - name
                      - email
                      additionalProperties: false
                    - type: 'null'
                    description: Who logged the entry. It differs from `member` when an admin logged it for someone else. Null for entries from before this was recorded and once that member has been deleted.
                  created_at:
                    type: string
                  canceled_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                  canceled_by:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        custom_id:
                          anyOf:
                          - type: string
                          - type: 'null'
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        email:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - id
                      - custom_id
                      - name
                      - email
                      additionalProperties: false
                    - type: 'null'
                    description: Who withdrew the entry. It differs from `member` when the member who logged it for them withdrew it. Null unless the status is CANCELED.
                  decline_reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                    description: The reason given when the entry was declined, also when an admin declined for the approver.
                  credited_amount:
                    anyOf:
                    - type: number
                    - type: 'null'
                    description: 'What was credited to the allowance: the recognized amount times `factor`, as booked. Null while there is no credit. Days (rounded to two decimals, for example 0.75 or 1.5) when `allowance_unit` is `days`, whole MINUTES when it is `hours`.'
                  credit_removed:
                    type: boolean
                    description: True when the entry is approved but its credit was deleted from the allowance afterwards.
                required:
                - id
                - member
                - allowance_type_id
                - allowance_unit
                - date
                - amount
                - recognized_amount
                - day_kind
                - factor
                - credit_expiry_date
                - comment
                - status
                - decided_by
                - decided_at
                - created_by
                - created_at
                - canceled_at
                - canceled_by
                - decline_reason
                - credited_amount
                - credit_removed
