  /overtime-entries/{id}/approve:
    post:
      operationId: overtime-approveOvertimeEntry
      summary: Approve an overtime entry
      description: 'Approves one approval step of a pending entry on behalf of the API key''s member: their own step first if they are an approver, otherwise the next pending one (an admin key can approve for any approver). In chains that need more than one approval the entry stays pending until the last step is approved and is credited then, so call it once per step and read the entry before retrying after a lost response. Send a lower `recognized_amount` to approve less than was logged; a `reason` is then required.'
      tags:
      - Overtime
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: The id of the overtime entry.
        required: true
        description: The id of the overtime entry.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recognized_amount:
                  description: Approve less than was logged. Never more than the current recognized amount. Days (0.5 or 1) when `allowance_unit` is `days`, whole MINUTES when it is `hours` (for example 90 = 1 hour 30 minutes).
                  type: number
                reason:
