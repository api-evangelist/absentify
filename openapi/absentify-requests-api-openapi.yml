  /requests_per_day:
    get:
      operationId: request-getRequestsPerDay
      summary: Get all requests per day
      description: 'Get all requests that overlap the `start`…`end` window, split into one entry per day.


        The window between `start` and `end` may span at most 1826 days (5 years). Wider ranges are rejected with a 400 response, so page through longer periods in smaller windows.'
