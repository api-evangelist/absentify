openapi: 3.2.0
info:
  title: absentify CRUD Requests API
  description: OpenAPI compliant REST API
  version: 1.0.0
servers:
- url: https://api.absentify.com/api/v1
tags:
- name: Requests
paths:
  /requests:
    get:
      operationId: request-getRequests
      summary: Get all requests
      description: 'Get all requests that overlap the `start`…`end` window.


        The window between `start` and `end` may span at most 1826 days (5 years). Wider ranges are rejected with a 400 response, so page through longer periods in smaller windows.'
      tags:
      - Requests
      security:
      - ApiKey: []
      parameters:
      - in: query
        name: start
        schema:
          description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used. The window between `start` and `end` may span at most 1826 days (5 years). Wider ranges are rejected with a 400 response, so page through longer periods in smaller windows.
          type: string
        required: true
        description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used. The window between `start` and `end` may span at most 1826 days (5 years). Wider ranges are rejected with a 400 response, so page through longer periods in smaller windows.
      - in: query
        name: end
        schema:
          description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used. The window between `start` and `end` may span at most 1826 days (5 years). Wider ranges are rejected with a 400 response, so page through longer periods in smaller windows.
          type: string
        required: true
        description: Date/time in ISO 8601 format, e.g. `2026-06-01` (interpreted as UTC midnight) or `2026-06-01T09:00:00Z`. Always include a time zone designator (`Z` for UTC) when sending a time of day. Localized formats such as `01.06.2026` or `06/01/2026` are misinterpreted and must not be used. The window between `start` and `end` may span at most 1826 days (5 years). Wider ranges are rejected with a 400 response, so page through longer periods in smaller windows.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - PENDING
          - APPROVED
          - DECLINED
          - CANCELED
      - in: query
        name: request_member_ids
        schema:
          type: string
      - in: query
        name: department_ids
        schema:
          type: string
      - in: query
        name: locale
        schema:
          type: string
          enum:
          - en
          - de
          - fr
          - hu
          - it
          - pl
          - pt
          - ru
          - es
          - tr
          - uk
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  anyOf:
                  - type: object
                    properties:
                      id:
                        type: string
                      createdAt:
                        type: string
                      updatedAt:
                        type: string
                      end:
                        type: string
                      start:
                        type: string
                      start_at:
                        type: string
                        enum:
                        - morning
                        - afternoon
                        description: 'For day-based leave types: whether the absence starts in the `morning` (the whole first day counts) or `afternoon` (only the second half of the first day). Ignored for hour-based leave types.'
                      end_at:
                        type: string
                        enum:
                        - lunchtime
                        - end_of_day
                        description: 'For day-based leave types: whether the absence ends at `lunchtime` (only the first half of the last day) or `end_of_day` (the whole last day counts). Ignored for hour-based leave types.'
                      leave_unit:
                        type: string
                        enum:
                        - days
                        - half_days
                        - hours
                        - minutes_30
                        - minutes_15
                        - minutes_10
                        - minutes_5
                        - minutes_1
                        description: 'The unit stored on this request. It governs duration and workday_absence_duration: day and half-day units use days; hour and minute units use minutes. It may differ from leave_type.leave_unit after the leave type changes.'
                      revision:
                        type: integer
                        minimum: -9007199254740991
                        maximum: 9007199254740991
                        description: Counts the versions of the request. Starts at 1 and goes up with every applied change. A pending, declined or withdrawn change does not change it.
                      last_changed_at:
                        anyOf:
                        - type: string
                        - type: 'null'
                        description: When the request was last changed, or null if it never was.
                      pending_change:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: integer
                              minimum: -9007199254740991
                              maximum: 9007199254740991
                            revision:
                              anyOf:
                              - type: integer
                                minimum: -9007199254740991
                                maximum: 9007199254740991
                              - type: 'null'
                              description: The revision the request gets when this change is applied. Null while the change is pending, declined or withdrawn.
                            kind:
                              type: string
                              enum:
                              - reason
                              - shortened
                              - extended
                              - moved
                              - leave_type
                            status:
                              type: string
                              enum:
                              - pending
                              - approved
                              - declined
                              - withdrawn
                              - applied
                              description: '`pending` waits for approvers, `applied` is in force, `declined` and `withdrawn` never changed the request.'
                            previous:
                              type: object
                              properties:
                                start:
                                  type: string
                                end:
                                  type: string
                                start_at:
                                  type: string
                                  enum:
                                  - morning
                                  - afternoon
                                  description: 'For day-based leave types: whether the absence starts in the `morning` (the whole first day counts) or `afternoon` (only the second half of the first day). Ignored for hour-based leave types.'
                                end_at:
                                  type: string
                                  enum:
                                  - lunchtime
                                  - end_of_day
                                  description: 'For day-based leave types: whether the absence ends at `lunchtime` (only the first half of the last day) or `end_of_day` (the whole last day counts). Ignored for hour-based leave types.'
                                leave_type:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    name:
                                      anyOf:
                                      - type: string
                                      - type: 'null'
                                  required:
                                  - id
                                  - name
                                  additionalProperties: false
                                duration:
                                  type: number
                                workday_absence_duration:
                                  type: number
                                reason:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                              required:
                              - start
                              - end
                              - start_at
                              - end_at
                              - leave_type
                              - duration
                              - workday_absence_duration
                              - reason
                              additionalProperties: false
                              description: The request as it was before this change.
                            proposed:
                              type: object
                              properties:
                                start:
                                  type: string
                                end:
                                  type: string
                                start_at:
                                  type: string
                                  enum:
                                  - morning
                                  - afternoon
                                  description: 'For day-based leave types: whether the absence starts in the `morning` (the whole first day counts) or `afternoon` (only the second half of the first day). Ignored for hour-based leave types.'
                                end_at:
                                  type: string
                                  enum:
                                  - lunchtime
                                  - end_of_day
                                  description: 'For day-based leave types: whether the absence ends at `lunchtime` (only the first half of the last day) or `end_of_day` (the whole last day counts). Ignored for hour-based leave types.'
                                leave_type:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                    name:
                                      anyOf:
                                      - type: string
                                      - type: 'null'
                                  required:
                                  - id
                                  - name
                                  additionalProperties: false
                                duration:
                                  type: number
                                workday_absence_duration:
                                  type: number
                                reason:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                              required:
                              - start
                              - end
                              - start_at
                              - end_at
                              - leave_type
                              - duration
                              - workday_absence_duration
                              - reason
                              additionalProperties: false
                              description: The request as this change wants it. Only for `applied` changes is this what is in force.
                            changed_by:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - name
                                additionalProperties: false
                              - type: 'null'
                            decided_by:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - name
                                additionalProperties: false
                              - type: 'null'
                            created_at:
                              type: string
                            decided_at:
                              anyOf:
                              - type: string
                              - type: 'null'
                            decision_reason:
                              anyOf:
                              - type: string
                              - type: 'null'
                          required:
                          - id
                          - revision
                          - kind
                          - status
                          - previous
                          - proposed
                          - changed_by
                          - decided_by
                          - created_at
                          - decided_at
                          - decision_reason
                          additionalProperties: false
                        - type: 'null'
                        description: The change that waits for a decision on an approved request, or null. The request fields still show the approved version until the change is applied.
                      request_creator_member:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            custom_id:
                              anyOf:
                              - type: string
                              - type: 'null'
                            name:
                              anyOf:
                              - type: string
                              - type: 'null'
                            email:
                              anyOf:
                              - type: string
                              - type: 'null'
                          required:
                          - id
                          - custom_id
                          - name
                          - email
                          additionalProperties: false
                        - type: 'null'
                      leave_type:
                        type: object
                        properties:
                          name:
                            type: string
                            description: Translated into `locale` when one is given and a translation exists, otherwise the stored name. Webhook payloads always carry the stored name.
                          default_name:
                            type: string
                            description: The stored name, without any translation applied.
                          id:
                            type: string
                          leave_unit:
                            type: string
                            enum:
                            - days
                            - half_days
                            - hours
                            - minutes_30
                            - minutes_15
                            - minutes_10
                            - minutes_5
                            - minutes_1
                            description: The leave type's current unit for new requests. Historical requests may have a different leave_unit.
                        required:
                        - name
                        - default_name
                        - id
                        - leave_unit
                        additionalProperties: false
                      approval_process:
                        type: string
                        enum:
                        - Linear_all_have_to_agree
                        - Linear_one_has_to_agree
                        - Parallel_all_have_to_agree
                        - Parallel_one_has_to_agree
                        - Parallel_first_response_decides
                      needs_approval:
                        anyOf:
                        - type: boolean
                        - type: 'null'
                        description: Whether the request needed approval, as recorded when it was created. When false, the approver rows were approved automatically. Null for requests created before this was recorded.
                      cancel_reason:
                        anyOf:
                        - type: string
                        - type: 'null'
                      canceld_by_member:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            custom_id:
                              anyOf:
                              - type: string
                              - type: 'null'
                            name:
                              anyOf:
                              - type: string
                              - type: 'null'
                            email:
                              anyOf:
                              - type: string
                              - type: 'null'
                          required:
                          - id
                          - custom_id
                          - name
                          - email
                          additionalProperties: false
                        - type: 'null'
                      requester_member:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            custom_id:
                              anyOf:
                              - type: string
                              - type: 'null'
                            name:
                              anyOf:
                              - type: string
                              - type: 'null'
                            email:
                              anyOf:
                              - type: string
                              - type: 'null'
                          required:
                          - id
                          - custom_id
                          - name
                          - email
                          additionalProperties: false
                        - type: 'null'
                      reason:
                        anyOf:
                        - type: string
                        - type: 'null'
                      take_from_allowance:
                        type: boolean
                      allowance_type:
                        anyOf:
                        - type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                              description: Translated into `locale` when one is given and a translation exists, otherwise the stored name. Webhook payloads always carry the stored name.
                            default_name:
                              type: string
                              description: The stored name, without any translation applied.
                            ignore_allowance_limit:
                              type: boolean
                            allowance_unit:
                              type: string
                              enum:
                              - days
                              - hours
                          required:
                          - id
                          - name
                          - default_name
                          - ignore_allowance_limit
                          - allowance_unit
                          additionalProperties: false
                        - type: 'null'
                      workday_absence_duration:
                        type: number
                      duration:
                        type: number
                      status:
                        type: string
                      canceld_date:
                        anyOf:
                        - type: string
                        - type: 'null'
                      request_approvers:
                        type: array
                        items:
                          type: object
                          properties:
                            reason:
                              anyOf:
                              - type: string
                              - type: 'null'
                            status:
                              type: string
                              enum:
                              - PENDING
                              - APPROVED
                              - DECLINED
                              - CANCELED
                              - APPROVED_BY_ANOTHER_MANAGER
                              - DECLINED_BY_ANOTHER_MANAGER
                              - CANCELED_BY_ANOTHER_MANAGER
                              - SKIPPED_ANOTHER_USER_APPROVED
                            status_changed_by_member:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  custom_id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  email:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - custom_id
                                - name
                                - email
                                additionalProperties: false
                              - type: 'null'
                            status_changed_date:
                              anyOf:
                              - type: string
                              - type: 'null'
                            approver_member:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  custom_id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  email:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - custom_id
                                - name
                                - email
                                additionalProperties: false
                              - type: 'null'
                          required:
                          - reason
                          - status
                          - status_changed_by_member
                          - status_changed_date
                          - approver_member
                          additionalProperties: false
                      request_representative_approvers:
                        type: array
                        items:
                          type: object
                          properties:
                            uuid:
                              type: string
                            reason:
                              anyOf:
                              - type: string
                              - type: 'null'
                            status:
                              type: string
                              enum:
                              - PENDING
                              - APPROVED
                              - DECLINED
                              - CANCELED
                              - APPROVED_BY_ANOTHER_MANAGER
                              - DECLINED_BY_ANOTHER_MANAGER
                              - CANCELED_BY_ANOTHER_MANAGER
                              - REPLACED
                              - SKIPPED
                              - SKIPPED_BY_ANOTHER_MANAGER
                              - SKIPPED_ANOTHER_USER_APPROVED
                              - SKIPPED_NOT_ENOUGH_REPRESENTATIVES
                            status_changed_by_member:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  custom_id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  email:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - custom_id
                                - name
                                - email
                                additionalProperties: false
                              - type: 'null'
                              description: Who answered for this representative. On a PENDING row added by a replacement, who chose this representative. On a REPLACED row, who replaced them, unless replaced_after_decline is true. On a SKIPPED or CANCELED row, who closed it.
                            status_changed_date:
                              anyOf:
                              - type: string
                              - type: 'null'
                              description: When the representative answered. On a PENDING row added by a replacement, when it was chosen. On a REPLACED row, when they were replaced, unless replaced_after_decline is true. On a SKIPPED or CANCELED row, when it was closed.
                            approver_member:
                              anyOf:
                              - type: object
                                properties:
                                  id:
                                    type: string
                                  custom_id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  email:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - custom_id
                                - name
                                - email
                                additionalProperties: false
                              - type: 'null'
                            replaced_to_member:
