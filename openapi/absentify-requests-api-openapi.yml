                    hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                    minute:
                      type: integer
                      minimum: 0
                      maximum: 59
                  required:
                  - hour
                  - minute
                end_time:
                  type: object
                  properties:
                    hour:
                      type: integer
                      minimum: 0
                      maximum: 23
                    minute:
                      type: integer
                      minimum: 0
                      maximum: 59
                  required:
                  - hour
                  - minute
                half_day:
                  type: string
                  enum:
                  - full_day
                  - morning
                  - afternoon
                weekDays:
                  anyOf:
                  - type: string
                  - type: 'null'
                day:
                  anyOf:
                  - anyOf:
                    - type: integer
                      minimum: 1
                      maximum: 31
                    - type: string
                  - type: 'null'
                month:
                  anyOf:
                  - type: integer
                    minimum: 1
                    maximum: 12
                  - type: 'null'
                pos:
                  anyOf:
                  - anyOf:
                    - type: integer
                      minimum: -1
                      maximum: 5
                    - type: string
                  - type: 'null'
                exDates:
                  type: array
                  items:
                    type: string
                files:
                  type: array
                  items:
                    type: string
                    format: uuid
