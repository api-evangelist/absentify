                          - type: 'null'
                      required:
                      - id
                      - name
                      additionalProperties: false
                    - type: 'null'
                  created_at:
                    type: string
                  decided_at:
                    anyOf:
                    - type: string
                    - type: 'null'
                  decision_reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                required:
                - id
