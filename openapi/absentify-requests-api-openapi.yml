      summary: Decline a change of a request
      description: Decline the pending change of an approved request on behalf of the user who created the API token. Only the approvers of the change (or an admin) can do this. The request stays as it was and the requester gets the reason. Fails with 409 when the change is no longer pending or when `revision` does not match the request.
