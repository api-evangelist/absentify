  /requests/{id}/changes:
    post:
      operationId: request-changeRequest
      summary: Change a request
      description: 'Change the reason, the period or the leave type of a request on behalf of the user who created the API token.


        Pending requests are changed in place: a new period or leave type restarts the approval, a reason change never does. Approved requests keep their approved version until a change is decided:


        - A new period inside the old one (shortening, same leave type) is applied at once and the days go back to the allowance, unless the leave type turns on `request_shortening_needs_approval`.

        - A longer or moved period, or a new leave type, creates a change request with status `pending`. The approved request stays in force everywhere (calendar, allowance, syncs) until the approvers approve it. Declining leaves it untouched. One change can be open per request: a new period or leave type withdraws the open one.

        - A reason change is applied at once and never needs approval.

        - Leave types without approval, and changes by admins or managers (`admin_approval_option: approve_request_immediately`), apply at once. For a new leave type, the new one decides whether approval is needed.


        The leave type must allow changes (`allow_request_changes`), and so must a new one; if one does not, the call is rejected with 403, like a request that has already started or that the caller may not change. A non-admin passing `admin_approval_option: approve_request_immediately` gets 403 too.


        A new leave type must be day-based or hour-based like the request: days and half days can be swapped for each other, and so can hours and minute units. Switching between the two is rejected with 400; cancel the request and create a new one instead.


        In a recurring series, the dates of a single approved occurrence can be changed, and only that occurrence changes. The dates of an occurrence that still waits for approval and the leave type of any occurrence can''t be changed (400).


        Send `start` and `end` together to change the period, and `leave_type_id` to change the leave type. Send `reason` to change the reason, or `null` to clear it. The response is the recorded change: its `status` is `applied` when it is in force and `pending` when it waits for approval (also shown as `pending_change` on the request). Approvers decide it with the `/requests/{id}/changes/{changeId}/approve` and `/decline` endpoints; the requester can `/withdraw` it.'
      tags:
      - Requests
      security:
      - ApiKey: []
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  anyOf:
                  - type: string
                  - type: 'null'
                start:
                  description: 'Start/end of the request in ISO 8601. For day-based leave types (`leave_unit: days`) send the date at midnight UTC (e.g. `2026-06-01T00:00:00Z`) and use `start_at` / `end_at` to set half-days. For hour-based leave types include the exact time of day (e.g. `2026-06-01T09:00:00Z`); `start_at` / `end_at` are then ignored.'
                  type: string
                end:
                  description: 'Start/end of the request in ISO 8601. For day-based leave types (`leave_unit: days`) send the date at midnight UTC (e.g. `2026-06-01T00:00:00Z`) and use `start_at` / `end_at` to set half-days. For hour-based leave types include the exact time of day (e.g. `2026-06-01T09:00:00Z`); `start_at` / `end_at` are then ignored.'
                  type: string
                start_at:
                  description: 'For day-based leave types: whether the absence starts in the `morning` (the whole first day counts) or `afternoon` (only the second half of the first day). Ignored for hour-based leave types.'
                  type: string
                  enum:
                  - morning
                  - afternoon
                end_at:
                  description: 'For day-based leave types: whether the absence ends at `lunchtime` (only the first half of the last day) or `end_of_day` (the whole last day counts). Ignored for hour-based leave types.'
                  type: string
                  enum:
                  - lunchtime
                  - end_of_day
                leave_type_id:
                  description: The new leave type, which must allow changes and be day-based or hour-based like the request.
                  type: string
                  format: uuid
                  pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$
                admin_approval_option:
                  description: Whether the change is applied at once (admins only) or goes through the normal approval process.
                  type: string
                  enum:
                  - approve_request_immediately
                  - go_through_the_normal_approval_process
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    minimum: -9007199254740991
                    maximum: 9007199254740991
                  revision:
                    anyOf:
                    - type: integer
                      minimum: -9007199254740991
                      maximum: 9007199254740991
                    - type: 'null'
                    description: The revision the request gets when this change is applied. Null while the change is pending, declined or withdrawn.
                  kind:
                    type: string
                    enum:
                    - reason
                    - shortened
                    - extended
                    - moved
                    - leave_type
                  status:
                    type: string
                    enum:
                    - pending
                    - approved
                    - declined
                    - withdrawn
                    - applied
                    description: '`pending` waits for approvers, `applied` is in force, `declined` and `withdrawn` never changed the request.'
                  previous:
                    type: object
                    properties:
                      start:
                        type: string
                      end:
                        type: string
                      start_at:
                        type: string
                        enum:
                        - morning
                        - afternoon
                        description: 'For day-based leave types: whether the absence starts in the `morning` (the whole first day counts) or `afternoon` (only the second half of the first day). Ignored for hour-based leave types.'
                      end_at:
                        type: string
                        enum:
                        - lunchtime
                        - end_of_day
                        description: 'For day-based leave types: whether the absence ends at `lunchtime` (only the first half of the last day) or `end_of_day` (the whole last day counts). Ignored for hour-based leave types.'
                      leave_type:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            anyOf:
                            - type: string
                            - type: 'null'
                        required:
                        - id
                        - name
                        additionalProperties: false
                      duration:
                        type: number
                      workday_absence_duration:
                        type: number
                      reason:
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - start
                    - end
                    - start_at
                    - end_at
                    - leave_type
                    - duration
                    - workday_absence_duration
                    - reason
                    additionalProperties: false
                    description: The request as it was before this change.
                  proposed:
                    type: object
                    properties:
                      start:
                        type: string
                      end:
                        type: string
                      start_at:
                        type: string
                        enum:
                        - morning
                        - afternoon
                        description: 'For day-based leave types: whether the absence starts in the `morning` (the whole first day counts) or `afternoon` (only the second half of the first day). Ignored for hour-based leave types.'
                      end_at:
                        type: string
                        enum:
                        - lunchtime
                        - end_of_day
                        description: 'For day-based leave types: whether the absence ends at `lunchtime` (only the first half of the last day) or `end_of_day` (the whole last day counts). Ignored for hour-based leave types.'
                      leave_type:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            anyOf:
                            - type: string
                            - type: 'null'
                        required:
                        - id
                        - name
                        additionalProperties: false
                      duration:
                        type: number
                      workday_absence_duration:
                        type: number
                      reason:
                        anyOf:
                        - type: string
                        - type: 'null'
                    required:
                    - start
                    - end
                    - start_at
                    - end_at
                    - leave_type
                    - duration
                    - workday_absence_duration
                    - reason
                    additionalProperties: false
                    description: The request as this change wants it. Only for `applied` changes is this what is in force.
                  changed_by:
                    anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                      required:
                      - id
                      - name
                      additionalProperties: false
                    - type: 'null'
                  decided_by:
                    anyOf:
                    - type: object
                      properties:
