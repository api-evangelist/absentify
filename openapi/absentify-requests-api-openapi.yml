  /requests/recurring:
    post:
      operationId: request-createRecurringRequests
      summary: Absentify Create Recurring Requests
      description: Create multiple recurring requests based on a recurrence pattern
      tags:
      - Requests
      security:
      - ApiKey: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
