                                  custom_id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  name:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  email:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                required:
                                - id
                                - custom_id
                                - name
                                - email
                                additionalProperties: false
                              - type: 'null'
                            replaced_after_decline:
                              type: boolean
                              description: When true, status_changed_by_member, status_changed_date and reason describe the representative's decline before they were replaced.
                          required:
