                          - status
                          - status_changed_by_member
                          - status_changed_date
                          - approver_member
                          - replaced_to_member
                          - replaced_after_decline
                          additionalProperties: false
                    required:
                    - id
                    - createdAt
                    - updatedAt
                    - end
                    - start
                    - start_at
                    - end_at
                    - leave_unit
                    - revision
                    - last_changed_at
                    - pending_change
                    - request_creator_member
                    - leave_type
                    - approval_process
                    - needs_approval
                    - cancel_reason
                    - canceld_by_member
                    - requester_member
                    - reason
                    - take_from_allowance
                    - allowance_type
                    - workday_absence_duration
                    - duration
                    - status
                    - canceld_date
                    - request_approvers
                    - request_representative_approvers
                    additionalProperties: false
                  - type: 'null'
        '400':
          description: Invalid input data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.BAD_REQUEST'
        '401':
          description: Authorization not provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error.UNAUTHORIZED'
        '403':
