        required: true
      - in: path
        name: changeId
        schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decline_reason:
                  type: string
                  minLength: 1
                  description: The reason for declining the change. The request itself stays as it is.
                revision:
                  description: Revision you last saw (from GET /requests/{id} or the webhook). If the request was changed since, the call fails with 409 and nothing happens.
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 9007199254740991
